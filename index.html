/* ===================== ลายเซ็นจากรูปถ่าย ===================== */
const SIG_KEY = 'pdftools.savedSignature';
function getSavedSignature(){ try{ return localStorage.getItem(SIG_KEY); }catch(e){ return null; } }
function saveSignature(d){ try{ localStorage.setItem(SIG_KEY, d); return true; }catch(e){ return false; } }
/* photo -> transparent signature canvas. opts: {sens(0.05-0.5), color:'#rrggbb'|null(keep dark), maxW} */
function extractSignature(img, opts){
  const maxSide = 1100;
  const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width*sc)), h = Math.max(1, Math.round(img.height*sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
  ctx.drawImage(img, 0, 0, w, h);
  const src = ctx.getImageData(0,0,w,h), d = src.data;
  const g = new Float32Array(w*h);
  for(let i=0;i<w*h;i++) g[i] = 0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2];
  // background estimate: box blur of the local max-ish (use blur of gray after clipping dark ink) via integral image
  const r = Math.max(12, Math.round(Math.min(w,h)/18));
  const sorted = Float32Array.from(g).sort(); const p80 = sorted[Math.floor(sorted.length*0.8)];
  const gc = new Float32Array(w*h); for(let i=0;i<w*h;i++) gc[i] = Math.max(g[i], p80*0.85); // limit ink influence on bg
  const W = w+1, I = new Float64Array(W*(h+1));
  for(let y=0;y<h;y++){ let row=0; for(let x=0;x<w;x++){ row += gc[y*w+x]; I[(y+1)*W+x+1] = I[y*W+x+1] + row; } }
  const sens = opts.sens, soft = 0.12;
  const out = ctx.createImageData(w,h), o = out.data;
  let col = [0,0,0]; if(opts.color){ col = [parseInt(opts.color.slice(1,3),16), parseInt(opts.color.slice(3,5),16), parseInt(opts.color.slice(5,7),16)]; }
  for(let y=0;y<h;y++){
    const y0=Math.max(0,y-r), y1=Math.min(h,y+r+1);
    for(let x=0;x<w;x++){
      const x0=Math.max(0,x-r), x1=Math.min(w,x+r+1);
      const area=(x1-x0)*(y1-y0);
      const bg = (I[y1*W+x1]-I[y0*W+x1]-I[y1*W+x0]+I[y0*W+x0])/area + 1;
      const ratio = 1 - g[y*w+x]/bg;
      let a = (ratio - sens)/soft; a = a<0?0:a>1?1:a; a = a*a*(3-2*a);
      const i=(y*w+x)*4;
      if(opts.color){ o[i]=col[0]; o[i+1]=col[1]; o[i+2]=col[2]; }
      else { const k = Math.max(0, Math.min(90, g[y*w+x]*0.5)); o[i]=o[i+1]=o[i+2]=k; }
      o[i+3] = Math.round(a*255);
    }
  }
  // crop to ink bounds (ignore specks: need >=2 ink px in a row/col)
  const rows = new Uint16Array(h), cols = new Uint16Array(w);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(o[(y*w+x)*4+3]>110){ rows[y]++; cols[x]++; }
  let t=0,b=h-1,l=0,rt=w-1;
  while(t<h && rows[t]<2) t++; while(b>t && rows[b]<2) b--;
  while(l<w && cols[l]<2) l++; while(rt>l && cols[rt]<2) rt--;
  if(t>=b || l>=rt) return null;
  const pad = 6; t=Math.max(0,t-pad); l=Math.max(0,l-pad); b=Math.min(h-1,b+pad); rt=Math.min(w-1,rt+pad);
  const full = document.createElement('canvas'); full.width=w; full.height=h; full.getContext('2d').putImageData(out,0,0);
  const cw = rt-l+1, ch = b-t+1, k = Math.min(1, (opts.maxW||900)/cw);
  const res = document.createElement('canvas'); res.width=Math.round(cw*k); res.height=Math.round(ch*k);
  const rc = res.getContext('2d'); rc.imageSmoothingQuality='high';
  rc.drawImage(full, l, t, cw, ch, 0, 0, res.width, res.height);
  return res;
}

/* ===================== เซ็นเอกสาร PDF ===================== */
function trimCanvasToPng(canvas){
  const x = canvas.getContext('2d'), {width:w, height:h} = canvas, d = x.getImageData(0,0,w,h).data;
  let t=h, b=-1, l=w, r=-1;
  for(let y=0;y<h;y++) for(let i=0;i<w;i++) if(d[(y*w+i)*4+3] > 20){ if(y<t)t=y; if(y>b)b=y; if(i<l)l=i; if(i>r)r=i; }
  if(b<0) return null;
  const p = 4; t=Math.max(0,t-p); l=Math.max(0,l-p); b=Math.min(h-1,b+p); r=Math.min(w-1,r+p);
  const c = document.createElement('canvas'); c.width = r-l+1; c.height = b-t+1;
  c.getContext('2d').drawImage(canvas, l, t, c.width, c.height, 0, 0, c.width, c.height);
  return c.toDataURL('image/png');
}

/* ===================== เพิ่มข้อความ/ตราประทับใน PDF ===================== */
registerTool({
  id:'stamp', cat:'mark', icon:'stamp',
  name:'เพิ่มข้อความลง PDF', desc:'พิมพ์ข้อความหรือตราประทับแล้ววางในตำแหน่งที่ต้องการ',
  longDesc:'พิมพ์ข้อความ เช่น วันที่รับเอกสาร หรือเลขที่หนังสือ แล้วแตะตำแหน่งบนหน้าเอกสารที่ต้องการวาง',
  render(container){
    let srcFile=null, srcBuf=null, placer=null, placedPoint=null;
    let text='ตัวอย่างข้อความ', fontPx=22, color='#20302C';
    const dz = buildDropzone({
      accept:'application/pdf', multiple:false, label:'เลือกไฟล์ PDF', sub:'เลือกไฟล์ PDF',
      onFiles: async (files) => { const f=files[0]; if(!f) return; srcFile=f; srcBuf=await readAsArrayBuffer(f); await drawUI(); }
    });
    container.appendChild(el('div',{class:'card'},[dz]));
    const uiWrap = el('div'); container.appendChild(uiWrap);
    const resultWrap = el('div'); container.appendChild(resultWrap);

    function currentMarkerHtml(){
      return `<span style="font-size:${fontPx}px;font-weight:600;color:${color};font-family:'Sarabun','Noto Sans Thai',sans-serif;">${text.replace(/</g,'&lt;')}</span>`;
    }

    async function drawUI(){
      resultWrap.innerHTML=''; uiWrap.innerHTML='';
      const card1 = el('div',{class:'card'});
      const tField = el('div',{class:'field'},[el('label',{},['ข้อความ']), el('input',{type:'text', value:text})]);
      tField.querySelector('input').addEventListener('input', e=>{ text = e.target.value; refreshMarker(); });
      card1.appendChild(tField);
      const sField = el('div',{class:'field'},[el('label',{},[`ขนาดตัวอักษร: ${fontPx}pt`]), el('input',{type:'range',min:'10',max:'48',step:'1',value:String(fontPx)})]);
      sField.querySelector('input').addEventListener('input', e=>{ fontPx=+e.target.value; sField.querySelector('label').textContent=`ขนาดตัวอักษร: ${fontPx}pt`; refreshMarker(); });
      card1.appendChild(sField);
      const cField = el('div',{class:'field'},[el('label',{},['สีข้อความ']), el('input',{type:'text', value:color})]);
      cField.querySelector('input').addEventListener('input', e=>{ color=e.target.value||'#20302C'; refreshMarker(); });
      card1.appendChild(cField);
      card1.appendChild(el('div',{class:'note'},['แตะตำแหน่งบนหน้าเอกสารด้านล่างเพื่อวางข้อความ']));
      uiWrap.appendChild(card1);

      const card2 = el('div',{class:'card'});
      placer = await buildPagePlacer(new Uint8Array(srcBuf), {
        onPick: (pt) => { placedPoint = pt; refreshMarker(); }
      });
      card2.appendChild(placer.el);
      uiWrap.appendChild(card2);

      function refreshMarker(){
        if(placedPoint) placer.setMarker({page:placedPoint.page, xr:placedPoint.xr, yr:placedPoint.yr, html:currentMarkerHtml()});
      }

      const goBtn = el('button',{class:'btn block'},['บันทึกข้อความลงในไฟล์']);
      goBtn.addEventListener('click', doApply);
      uiWrap.appendChild(goBtn);
    }
    async function doApply(){
      if(!placedPoint){ toast('กรุณาแตะตำแหน่งที่ต้องการวางข้อความก่อน', true); return; }
      resultWrap.innerHTML='';
      resultWrap.appendChild(el('div',{class:'note'},[el('span',{class:'spinner'}),'กำลังบันทึก...']));
      try{
        const doc = await PDFLib.PDFDocument.load(srcBuf, {ignoreEncryption:true});
        const {dataUrl, width, height} = textToImageDataURL(text, {fontPx: fontPx*1.6, color, opacity:1, weight:600});
        const pngBytes = await fetchPngBytesFromDataUrl(dataUrl);
        const png = await doc.embedPng(pngBytes);
        const page = doc.getPages()[placedPoint.page - 1];
        const {width:pw, height:ph} = page.getSize();
        const drawW = width * 0.75; // canvas px roughly to pt
        const drawH = height * 0.75;
        const xPt = placedPoint.xr * pw - drawW/2;
        const yPt = ph - (placedPoint.yr * ph) - drawH/2;
        page.drawImage(png, {x:xPt, y:yPt, width:drawW, height:drawH});
        const bytes = await doc.save();
        resultWrap.innerHTML='';
        const box = el('div',{class:'result-box'},[el('div',{class:'rtext'},[el('div',{class:'rtitle'},['บันทึกข้อความเรียบร้อย']),el('div',{class:'rsub'},[fmtBytes(bytes.length)])])]);
        const dl = el('button',{class:'btn'},['ดาวน์โหลด PDF']);
        dl.addEventListener('click', ()=>downloadBytes(bytes, `${srcFile.name.replace(/\.pdf$/i,'')}-เพิ่มข้อความ.pdf`, 'application/pdf'));
        box.appendChild(dl); resultWrap.appendChild(box);
      }catch(err){
        console.error(err);
        resultWrap.innerHTML='';
        resultWrap.appendChild(el('div',{class:'note warn'},['บันทึกไม่สำเร็จ: '+err.message]));
      }
    }
  }
});
/* ---------- stamp renderers (canvas, Thai-safe) ---------- */
async function renderTextStamp({lines, color, style}){
  const fam = "'Sarabun','Noto Sans Thai',Tahoma,sans-serif";
  try{ await document.fonts.load(`700 40px Sarabun`, 'ก'); }catch(e){}
  const S = 3, sizes = lines.map((l,i) => i===0 ? 30 : 22);
  const m = document.createElement('canvas').getContext('2d');
  const widths = lines.map((l,i) => { m.font = `${i===0?700:600} ${sizes[i]*S}px ${fam}`; return m.measureText(l).width; });
  const padX = 18*S, padY = 12*S, gap = 6*S, bw = (style==='double' ? 2.5 : 3.5) * S;
  const W = Math.ceil(Math.max(...widths) + padX*2 + bw*2 + (style==='double'?10*S:0));
  const lineH = sizes.map(s => s*S*1.35);
  const H = Math.ceil(lineH.reduce((a,b)=>a+b,0) + gap*(lines.length-1) + padY*2 + bw*2 + (style==='double'?10*S:0));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.strokeStyle = color; x.fillStyle = color; x.lineWidth = bw;
  const rr = (p, rad) => { x.beginPath(); x.roundRect ? x.roundRect(p, p, W-2*p, H-2*p, rad) : x.rect(p, p, W-2*p, H-2*p); x.stroke(); };
  if(style === 'round') rr(bw, 16*S);
  else if(style === 'double'){ rr(bw, 4*S); rr(bw + 6*S, 2*S); }
  else if(style === 'rect') rr(bw, 3*S);
  let y = (H - (lineH.reduce((a,b)=>a+b,0) + gap*(lines.length-1)))/2;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  lines.forEach((l,i) => { x.font = `${i===0?700:600} ${sizes[i]*S}px ${fam}`; x.fillText(l, W/2, y + lineH[i]/2); y += lineH[i] + gap; });
  // slight ink texture for a stamp look
  const d = x.getImageData(0,0,W,H); for(let i=3;i<d.data.length;i+=4){ if(d.data[i] && Math.random()<0.06) d.data[i] = d.data[i]*0.55; } x.putImageData(d,0,0);
  return c.toDataURL('image/png');
}

/* ===================== กรอกฟอร์ม PDF ===================== */
function wrapThaiText(ctx, text, maxW){
  const out = [];
  const seg = (window.Intl && Intl.Segmenter) ? new Intl.Segmenter('th', {granularity:'word'}) : null;
  text.split('\n').forEach(para => {
    const words = seg ? Array.from(seg.segment(para), s => s.segment) : Array.from(para);
    let line = '';
    words.forEach(w => {
      if(ctx.measureText(line + w).width <= maxW || !line){ line += w; }
      else { out.push(line.trimEnd()); line = w.trimStart(); }
    });
    out.push(line);
  });
  return out;
}
/* draw text into a PNG sized for a field rect (pt). returns dataUrl */
async function fieldTextImage(text, wPt, hPt, multiline){
  try{ await document.fonts.load('400 20px Sarabun', 'ก'); }catch(e){}
  const S = 4, fam = "'Sarabun','Noto Sans Thai',Tahoma,sans-serif";
  const c = document.createElement('canvas'); c.width = Math.max(4, Math.round(wPt*S)); c.height = Math.max(4, Math.round(hPt*S));
  const x = c.getContext('2d'); x.fillStyle = '#000'; x.textBaseline = 'middle';
  const padX = 2*S;
  if(!multiline){
    let fs = Math.min(hPt*0.72, 13) * S;
    x.font = `${fs}px ${fam}`;
    const tw = x.measureText(text).width;
    if(tw > c.width - padX*2){ fs = fs * (c.width - padX*2) / tw; x.font = `${fs}px ${fam}`; }
    x.fillText(text, padX, c.height/2);
  } else {
    let fs = Math.min(11, hPt*0.7) * S, lines;
    for(;;){ x.font = `${fs}px ${fam}`; lines = wrapThaiText(x, text, c.width - padX*2); if(lines.length*fs*1.3 <= c.height || fs < 5*S) break; fs *= 0.9; }
    lines.forEach((l,i) => x.fillText(l, padX, fs*0.75 + i*fs*1.3));
  }
  return c.toDataURL('image/png');
}
registerTool({

      const L = PDFLib, pages = doc.getPages();
      const pageIndexOf = ref => pages.findIndex(p => p.ref === ref || (ref && p.ref.objectNumber === ref.objectNumber));
      fields = [];
      let all = [];
      try{ all = doc.getForm().getFields(); }catch(e){}
      all.forEach(f => {
        let type = null;
        if(f instanceof L.PDFTextField) type = 'text';
        else if(f instanceof L.PDFCheckBox) type = 'check';
        else if(f instanceof L.PDFDropdown || f instanceof L.PDFOptionList) type = 'choice';
        else if(f instanceof L.PDFRadioGroup) type = 'radio';
        if(!type) return;
        if(f.isReadOnly && f.isReadOnly()) return;
        const widgets = f.acroField.getWidgets();

          let onValue = null;
          if(type === 'radio' || type === 'check'){ try{ onValue = w.getOnValue() ? w.getOnValue().decodeText() : null; }catch(e){} }
          if(type === 'radio'){ try{ const opts = f.getOptions(); if(opts[wi] != null) onValue = opts[wi]; }catch(e){} }
          fields.push({f, type, page: pi+1, rect: r, wi, onValue, name: f.getName()});
        });
        // initial values
        if(type === 'text') values.set(f, f.getText() || '');
        else if(type === 'check') values.set(f, f.isChecked());
        else if(type === 'choice'){ const s = f.getSelected(); values.set(f, s && s[0] || ''); }

      if(pdfjsDoc.numPages <= 1) nav.style.display = 'none';

      stage = el('div', {style:'position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;'});

      fields.filter(x => x.page === current).forEach(x => {

        const pos = `position:absolute;left:${left}%;top:${top}%;width:${wPct}%;height:${hPct}%;box-sizing:border-box;`;
        const base = 'background:rgba(214,234,255,.75);border:1px solid #6aa0e0;border-radius:2px;font-family:Sarabun,Tahoma,sans-serif;color:#000;padding:0 2px;';

          input.addEventListener('input', () => { values.set(x.f, input.value); $$('[data-fname]', stage).forEach(o => { if(o !== input && o.dataset.fname === x.name) o.value = input.value; }); });

          input = el('div', {style:pos + base + 'display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;' + fsz.replace(/[\d.]+ \//, (r.height*0.9)+' /')});

      }catch(err){ console.error(err); resultWrap.innerHTML = ''; resultWrap.appendChild(el('div', {class:'note warn'}, ['บันทึกไม่สำเร็จ: ' + err.message])); }

registerTool({
  id:'redact', cat:'mark', icon:'redact',

    function drawUI(){
      uiWrap.innerHTML = ''; resultWrap.innerHTML = '';
      const card = el('div', {class:'card'});
      card.appendChild(el('div', {class:'note'}, ['ลากนิ้ว/เมาส์บนหน้าเอกสารเพื่อวาดกรอบสีดำทับข้อมูล (เลื่อนดูหน้าอื่นด้วยปุ่มลูกศร)']));

      img = el('img', {style:'display:block;width:100%;pointer-events:none;', draggable:'false'});
      stage.appendChild(img); card.appendChild(stage);
      const row = el('div', {class:'row', style:'gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;'});
      const undo = el('button', {class:'btn secondary sm'}, ['ย้อนกรอบล่าสุด']);
      const clr = el('button', {class:'btn secondary sm'}, ['ล้างกรอบหน้านี้']);
      countEl = el('span', {class:'note', style:'margin:0;'});
      undo.addEventListener('click', () => { (rects[current]||[]).pop(); drawRects(); });
      clr.addEventListener('click', () => { rects[current] = []; drawRects(); });
      row.append(undo, clr, countEl); card.appendChild(row);
      uiWrap.appendChild(card);
      const go = el('button', {class:'btn block'}, ['ปิดทับและบันทึกไฟล์']);
      go.addEventListener('click', apply);
      uiWrap.appendChild(go);
      let start = null, live = null;
      const rel = e => { const r = stage.getBoundingClientRect(); return {x: Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)), y: Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))}; };
      stage.addEventListener('pointerdown', e => { e.preventDefault(); stage.setPointerCapture(e.pointerId); start = rel(e); live = el('div', {style:'position:absolute;background:rgba(0,0,0,.75);outline:2px solid #e23;'}); stage.appendChild(live); });
      stage.addEventListener('pointermove', e => { if(!start) return; const p = rel(e); const r = norm(start, p); Object.assign(live.style, {left:r.x*100+'%', top:r.y*100+'%', width:r.w*100+'%', height:r.h*100+'%'}); });
      const end = e => { if(!start) return; const r = norm(start, rel(e)); start = null; live && live.remove(); live = null;
        if(r.w > 0.008 && r.h > 0.005){ (rects[current] = rects[current]||[]).push(r); } drawRects(); };
      stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
      drawPage();
    }
    const norm = (a, b) => ({x:Math.min(a.x,b.x), y:Math.min(a.y,b.y), w:Math.abs(a.x-b.x), h:Math.abs(a.y-b.y)});
    async function drawPage(){
      label.textContent = `หน้า ${current} จาก ${pdfjsDoc.numPages}`;

      const pagesWith = Object.keys(rects).filter(k => rects[k].length).map(Number);

      resultWrap.innerHTML = '';
      const status = el('div', {class:'note'}, [el('span',{class:'spinner'}), 'กำลังปิดทับข้อมูล...']);

      try{
        const src = await PDFLib.PDFDocument.load(srcBuf, {ignoreEncryption:true});
        const out = await PDFLib.PDFDocument.create();
        const n = src.getPageCount();
        for(let i=1;i<=n;i++){
          if(rects[i] && rects[i].length){
            status.lastChild.textContent = `กำลังแปลงหน้า ${i}...`;
            const page = await pdfjsDoc.getPage(i);
            const vp1 = page.getViewport({scale:1});
            const scale = Math.min(2.8, 2600 / Math.max(vp1.width, vp1.height));
            const vp = page.getViewport({scale});
            const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
            const cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,c.width,c.height);
            await page.render({canvasContext: cx, viewport: vp}).promise;
            cx.fillStyle = '#000';
            rects[i].forEach(r => cx.fillRect(Math.floor(r.x*c.width)-1, Math.floor(r.y*c.height)-1, Math.ceil(r.w*c.width)+2, Math.ceil(r.h*c.height)+2));
            const jpg = await out.embedJpg(await fetchPngBytesFromDataUrl(c.toDataURL('image/jpeg', 0.9)));
            const p = out.addPage([vp1.width, vp1.height]);
            p.drawImage(jpg, {x:0, y:0, width:vp1.width, height:vp1.height});
          } else {
            const [cp] = await out.copyPages(src, [i-1]); out.addPage(cp);
          }
        }
        const bytes = await out.save();
        const name = srcFile.name.replace(/\.pdf$/i,'') + '-ปิดทับ.pdf';
        resultWrap.innerHTML = '';
        const box = el('div', {class:'result-box'}, [el('div', {class:'rtext'}, [el('div', {class:'rtitle'}, [name]), el('div', {class:'rsub'}, [`${fmtBytes(bytes.length)} • ปิดทับ ${pagesWith.length} หน้า`])])]);
        const dl = el('button', {class:'btn'}, ['ดาวน์โหลด PDF']);
        dl.addEventListener('click', () => downloadBytes(bytes, name, 'application/pdf'));
        box.appendChild(dl); resultWrap.appendChild(box);
      }catch(err){ console.error(err); resultWrap.innerHTML = ''; resultWrap.appendChild(el('div', {class:'note warn'}, ['ปิดทับไม่สำเร็จ: ' + err.message])); }
    }
  }
});

/* ===================== รับไฟล์ที่แชร์มาจากแอปอื่น (Android share target) ===================== */
function fileMatchesAccept(file, accept){
  if(!accept) return true;
  const name = (file.name||'').toLowerCase(), type = (file.type||'').toLowerCase();
  return accept.split(',').map(s => s.trim().toLowerCase()).filter(Boolean).some(a => {
    if(a.startsWith('.')) return name.endsWith(a);
    if(a.endsWith('/*')) return type.startsWith(a.slice(0,-1));
    return type === a;
  });
}
async function readSharedInbox(){
  if(!('caches' in window)) return [];
  const cache = await caches.open('pdf2-share-inbox');
  const keys = await cache.keys(), files = [];
  for(const k of keys){
    const r = await cache.match(k); if(!r) continue;
    const blob = await r.blob();
    files.push(new File([blob], decodeURIComponent(r.headers.get('X-Name') || 'ไฟล์'), {type: r.headers.get('Content-Type') || blob.type}));
    await cache.delete(k);
  }
  return files;
}
function showSharedPicker(files){
  const main = $('#main'); main.innerHTML = '';
  main.appendChild(el('div', {class:'tool-header'}, [el('div', {class:'tool-title'}, ['ไฟล์ที่แชร์มา']), el('div', {class:'tool-sub'}, ['เลือกเครื่องมือที่ต้องการใช้กับไฟล์นี้'])]));
  const list = el('div', {class:'filelist'});
  files.forEach(f => list.appendChild(el('div', {class:'file-item'}, [el('span', {class:'fname'}, [f.name]), el('span', {class:'fsize'}, [fmtBytes(f.size)])])));
  main.appendChild(list);
  const tools = TOOLS.filter(t => !t.disabled && t.accepts && files.every(f => fileMatchesAccept(f, t.accepts)));
  if(!tools.length){ main.appendChild(el('div', {class:'note warn'}, ['ยังไม่มีเครื่องมือที่รองรับไฟล์ชนิดนี้'])); }
  const tl = el('div', {class:'tool-list'});
  tools.forEach(t => {
    const row = el('button', {class:'tool-row', type:'button'}, [el('span', {class:'tool-icon'}, [iconChip(t.icon)]), el('div', {class:'tool-text'}, [el('div', {class:'tool-name'}, [t.name]), el('div', {class:'tool-desc'}, [t.desc])]), el('span', {class:'chevron', html:ICONS.next})]);
    row.addEventListener('click', () => { window.__sharedFiles = files; openTool(t); });
    tl.appendChild(row);
  });
  main.appendChild(tl);
  const home = el('button', {class:'btn ghost', style:'margin-top:16px;'}, ['ไปหน้ารวมเครื่องมือ']);
  home.addEventListener('click', renderHome); main.appendChild(home);
}
async function handleShareLaunch(){
  if(!/[?&]shared=1/.test(location.search)) return false;
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
  const files = await readSharedInbox();
  if(!files.length){ toast('ไม่พบไฟล์ที่แชร์มา', true); return false; }
  showSharedPicker(files);
  return true;
}

/* ===================== Tool registry & navigation ===================== */
/* Each tool: id, cat, name, desc, icon, disabled(optional), render(container) */

function renderHome(){
  const main = $('#main');
  main.innerHTML = '';
  main.appendChild(el('p', {class:'intro'}, ['รวมเครื่องมือจัดการเอกสาร PDF ไว้ในที่เดียว — สแกน รวม แยก แปลง และลงชื่อเอกสาร ใช้ได้จากมือถือหรือคอมพิวเตอร์เครื่องไหนก็ได้ ไม่ต้องติดตั้งโปรแกรมเพิ่ม']));
  CATEGORIES.forEach(cat => {
    main.appendChild(el('div', {class:'category-label'}, [cat.label]));
    const list = el('div', {class:'tool-list'});
    TOOLS.filter(t => t.cat === cat.id).forEach(t => {
      const row = el('button', {class:'tool-row', type:'button'}, [
        el('span', {class:'tool-icon'}, [iconChip(t.icon)]),
        el('div', {class:'tool-text'}, [
          el('div', {class:'tool-name'}, [t.name, t.disabled ? el('span',{class:'badge'},['เร็วๆ นี้']) : null]),
          el('div', {class:'tool-desc'}, [t.desc]),
        ]),
        el('span', {class:'chevron', html: t.disabled ? '' : ICONS.next}),
      ]);
      if(t.disabled){ row.disabled = true; }
      else row.addEventListener('click', () => openTool(t));
      list.appendChild(row);
    });
    main.appendChild(list);
  });
}

function openTool(t){
  const main = $('#main');
  main.innerHTML = '';
  const back = el('button', {class:'back-link', type:'button'}, [iconChip('back'), ' กลับไปหน้ารวมเครื่องมือ']);
  back.addEventListener('click', renderHome);
  main.appendChild(back);
  const header = el('div', {class:'tool-header'}, [
    el('div', {class:'tool-title'}, [t.name]),
    el('div', {class:'tool-sub'}, [t.longDesc || t.desc]),
  ]);
  main.appendChild(header);
  const body = el('div');
  main.appendChild(body);
  try{
    t.render(body);
  }catch(err){
    console.error(err);
    body.appendChild(el('div', {class:'note warn'}, ['เกิดข้อผิดพลาด: ' + err.message]));
  }
  window.scrollTo(0,0);
}

window.addEventListener('DOMContentLoaded', async () => {
  if(!window.PDFLib){ toast('โหลดไลบรารี PDF ไม่สำเร็จ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต', true); }
  renderHome();
  try{ await handleShareLaunch(); }catch(e){ console.error(e); }
});
