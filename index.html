<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เครื่องมือ PDF 2</title>
<meta name="theme-color" content="#1E4F46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="เครื่องมือ PDF 2">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F3EC;
  --panel:#FFFFFF;
  --ink:#20302C;
  --ink-soft:#5B6B64;
  --line:#DDD7C6;
  --teal:#2F6F63;
  --teal-dark:#1E4F46;
  --teal-tint:#E6EFEA;
  --ochre:#AD7A26;
  --ochre-tint:#F4E9D6;
  --danger:#B0392F;
  --danger-tint:#F6E4E1;
  --radius:10px;
  --font-head:'Kanit',system-ui,sans-serif;
  --font-body:'Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  padding:22px 20px 16px;
  border-bottom:1px solid var(--line);
  background:var(--paper);
  position:sticky;top:0;z-index:5;
}
.topbar-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.brand{font-family:var(--font-head);font-weight:700;font-size:20px;letter-spacing:.2px;color:var(--teal-dark);}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:12.5px;color:var(--ink-soft);margin-top:2px;letter-spacing:0;}
.back-link{
  border:none;background:none;font-family:var(--font-body);font-size:15px;color:var(--teal-dark);
  cursor:pointer;padding:6px 0;display:inline-flex;align-items:center;gap:6px;font-weight:600;
}
.back-link:hover{text-decoration:underline;}
.back-link svg{width:16px;height:16px;flex:none;}
main{flex:1;padding:18px 20px 60px;}
.intro{margin:4px 0 22px;color:var(--ink-soft);font-size:15px;max-width:52ch;}
.category-label{
  font-family:var(--font-head);font-weight:600;font-size:13px;color:var(--teal-dark);
  margin:26px 0 10px;padding-top:2px;
}
.category-label:first-of-type{margin-top:0;}
.tool-list{border-top:1px solid var(--line);}
.tool-row{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 4px;border-bottom:1px solid var(--line);
  cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;
  width:100%;text-align:left;font-family:inherit;color:inherit;
}
.tool-row:hover{background:var(--teal-tint);}
.tool-row:disabled{cursor:not-allowed;opacity:.55;}
.tool-row:disabled:hover{background:none;}
.tool-icon{
  flex:none;width:38px;height:38px;border-radius:9px;background:var(--teal-tint);
  display:flex;align-items:center;justify-content:center;color:var(--teal-dark);
}
.tool-icon svg{width:19px;height:19px;}
.tool-text{flex:1;min-width:0;padding-top:2px;}
.tool-name{font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:8px;}
.tool-desc{color:var(--ink-soft);font-size:13.5px;margin-top:2px;}
.badge{
  font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--ochre);
  background:var(--ochre-tint);border-radius:20px;padding:2px 9px;
}
.chevron{flex:none;color:var(--ink-soft);align-self:center;opacity:.6;}

.tool-header{margin-bottom:18px;}
.tool-title{font-family:var(--font-head);font-weight:700;font-size:22px;color:var(--teal-dark);margin:10px 0 4px;}
.tool-sub{color:var(--ink-soft);font-size:14.5px;max-width:56ch;}
.note{
  font-size:13.5px;color:var(--ink-soft);background:var(--teal-tint);border-radius:var(--radius);
  padding:10px 13px;margin:14px 0;border:1px solid #D3E3DC;
}
.note.warn{background:var(--ochre-tint);border-color:#E7D3AC;color:#7A5A19;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.dropzone{
  border:1.5px dashed #C7BFA8;border-radius:var(--radius);padding:30px 16px;text-align:center;
  background:#FBFAF6;cursor:pointer;transition:border-color .15s,background .15s;
}
.dropzone.drag{border-color:var(--teal);background:var(--teal-tint);}
.dropzone p{margin:0 0 12px;color:var(--ink-soft);font-size:14.5px;}
.btn{
  font-family:var(--font-body);font-weight:600;font-size:14.5px;border-radius:8px;
  padding:10px 18px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer;
}
.btn:hover{background:var(--teal-dark);border-color:var(--teal-dark);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.secondary{background:#fff;color:var(--teal-dark);border-color:var(--teal);}
.btn.secondary:hover{background:var(--teal-tint);}
.btn.ghost{background:none;color:var(--ink-soft);border-color:var(--line);}
.btn.ghost:hover{background:#F0EEE4;}
.btn.danger{background:#fff;color:var(--danger);border-color:#DEB4AE;}
.btn.danger:hover{background:var(--danger-tint);}
.btn.block{width:100%;}
.btn.sm{padding:6px 11px;font-size:13px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.row.between{justify-content:space-between;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.field .hint{font-weight:400;color:var(--ink-soft);font-size:12.5px;}
.field input[type=text],.field input[type=password],.field input[type=number],.field select,.field textarea{
  width:100%;font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink);
}
.field input[type=range]{width:100%;accent-color:var(--teal);}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.seg button{
  flex:1;padding:8px 10px;border:none;background:#fff;font-family:inherit;font-size:13.5px;
  color:var(--ink-soft);cursor:pointer;border-right:1px solid var(--line);
}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--teal);color:#fff;font-weight:600;}
.filelist{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
.file-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;background:#FBFAF6;
  border:1px solid var(--line);border-radius:8px;
}
.file-item .fname{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-item .fsize{color:var(--ink-soft);font-size:12.5px;flex:none;}
.iconbtn{
  border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;height:28px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);flex:none;
}
.iconbtn:hover{background:var(--teal-tint);color:var(--teal-dark);}
.iconbtn svg{width:14px;height:14px;}
.thumbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:14px 0;}
.thumb{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#FBFAF6;}
.thumb .thimg{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff;display:block;border-bottom:1px solid var(--line);}
.thumb .tctrl{display:flex;justify-content:space-between;padding:5px 6px;gap:4px;}
.thumb .tlabel{font-size:11.5px;color:var(--ink-soft);text-align:center;padding:3px 0 0;}
.result-box{
  margin-top:16px;padding:16px;border-radius:var(--radius);background:var(--teal-tint);
  border:1px solid #D3E3DC;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.result-box .rtext{flex:1;min-width:180px;}
.result-box .rtitle{font-weight:600;color:var(--teal-dark);font-size:15px;}
.result-box .rsub{color:var(--ink-soft);font-size:13px;margin-top:2px;}
.spinner{
  width:16px;height:16px;border:2px solid #C6DAD3;border-top-color:var(--teal-dark);
  border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:7px;
}
@keyframes spin{to{transform:rotate(360deg);}}
.placer{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;}
.placer img{display:block;max-width:100%;height:auto;}
.placer .marker{
  position:absolute;transform:translate(-50%,-100%);pointer-events:none;
  font-family:inherit;white-space:pre;color:#000;
}
.pagenav{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13.5px;color:var(--ink-soft);}
.sigpad-wrap canvas{border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;width:100%;max-width:420px;height:160px;}
.cropbox{position:absolute;border:2px dashed var(--teal);background:rgba(47,111,99,.08);pointer-events:none;}
footer.appfoot{padding:20px;text-align:center;color:var(--ink-soft);font-size:12.5px;border-top:1px solid var(--line);}
@media(max-width:480px){
  .tool-title{font-size:19px;}
  main{padding:16px 14px 50px;}
  .topbar{padding:18px 14px 14px;}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">เครื่องมือ PDF 2<small>ใช้งานส่วนตัว · ประมวลผลในเครื่องทั้งหมด ไม่อัปโหลดขึ้นเซิร์ฟเวอร์</small></div>
    </div>
  </div>
  <main id="main"></main>
  <footer class="appfoot">ไฟล์ทั้งหมดประมวลผลในเบราว์เซอร์ของคุณ — ไม่มีการส่งเอกสารออกไปที่ใด</footer>
</div>

<script>
/* ===================== Utilities ===================== */
const $ = (sel, el) => (el||document).querySelector(sel);
const $$ = (sel, el) => Array.from((el||document).querySelectorAll(sel));
function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k === 'html') e.innerHTML = attrs[k];
    else if(k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => { if(c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function fmtBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(2) + ' MB';
}
function readAsArrayBuffer(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsArrayBuffer(file);
  });
}
function readAsDataURL(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}
function loadImage(src){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}
function downloadBytes(bytes, filename, mime){
  const blob = new Blob([bytes], {type: mime || 'application/octet-stream'});
  downloadBlob(blob, filename);
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
}
function niceDate(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
async function pdfjsFromBytes(bytes){
  const task = pdfjsLib.getDocument({data: bytes.slice ? bytes.slice(0) : bytes});
  return task.promise;
}
async function renderPageToCanvas(pdfjsDoc, pageNumber, targetWidth){
  const page = await pdfjsDoc.getPage(pageNumber);
  const base = page.getViewport({scale:1});
  const scale = targetWidth ? (targetWidth / base.width) : 1;
  const viewport = page.getViewport({scale});
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);
  const ctx = canvas.getContext('2d');
  await page.render({canvasContext: ctx, viewport}).promise;
  return canvas;
}
/* Render text (supports Thai via browser font rendering) to a transparent PNG data URL */
function textToImageDataURL(text, opts){
  opts = opts || {};
  const fontPx = opts.fontPx || 28;
  const fontFamily = opts.fontFamily || "'Sarabun','Noto Sans Thai',Tahoma,sans-serif";
  const weight = opts.weight || 600;
  const color = opts.color || '#000000';
  const opacity = opts.opacity == null ? 1 : opts.opacity;
  const rotateDeg = opts.rotateDeg || 0;
  const pad = opts.pad == null ? 10 : opts.pad;
  const measureCanvas = document.createElement('canvas');
  const mctx = measureCanvas.getContext('2d');
  mctx.font = `${weight} ${fontPx}px ${fontFamily}`;
  const metrics = mctx.measureText(text);
  const textW = Math.ceil(metrics.width);
  const textH = Math.ceil(fontPx * 1.35);
  const rad = Math.abs(rotateDeg) * Math.PI / 180;
  const rotW = Math.ceil(Math.abs(textW*Math.cos(rad)) + Math.abs(textH*Math.sin(rad))) + pad*2;
  const rotH = Math.ceil(Math.abs(textW*Math.sin(rad)) + Math.abs(textH*Math.cos(rad))) + pad*2;
  const canvas = document.createElement('canvas');
  canvas.width = rotW; canvas.height = rotH;
  const ctx = canvas.getContext('2d');
  ctx.translate(rotW/2, rotH/2);
  ctx.rotate(-rotateDeg * Math.PI/180);
  ctx.font = `${weight} ${fontPx}px ${fontFamily}`;
  ctx.fillStyle = color;
  ctx.globalAlpha = opacity;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, 0);
  return {dataUrl: canvas.toDataURL('image/png'), width: rotW, height: rotH};
}
async function fetchPngBytesFromDataUrl(dataUrl){
  const res = await fetch(dataUrl);
  return new Uint8Array(await res.arrayBuffer());
}
function fitInBox(w, h, maxW, maxH){
  const r = Math.min(maxW/w, maxH/h, 1);
  return {width: w*r, height: h*r};
}
function toast(msg, isErr){
  let t = $('#toast');
  if(!t){
    t = el('div', {id:'toast'});
    t.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#20302C;color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:88vw;text-align:center;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = isErr ? '#B0392F' : '#20302C';
  t.style.opacity = '1';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.transition='opacity .4s'; t.style.opacity='0'; }, 3200);
}

function buildDropzone({accept, multiple, label, sub, onFiles}){
  const input = el('input', {type:'file', accept: accept||'', style:'display:none'});
  if(multiple) input.multiple = true;
  const zone = el('div', {class:'dropzone'}, [
    el('p', {}, [label || 'ลากไฟล์มาวาง หรือแตะเพื่อเลือกไฟล์']),
    el('button', {class:'btn', type:'button'}, [sub || 'เลือกไฟล์'])
  ]);
  zone.appendChild(input);
  zone.addEventListener('click', () => input.click());
  ['dragenter','dragover'].forEach(evt => zone.addEventListener(evt, e => {
    e.preventDefault(); e.stopPropagation(); zone.classList.add('drag');
  }));
  ['dragleave','drop'].forEach(evt => zone.addEventListener(evt, e => {
    e.preventDefault(); e.stopPropagation(); zone.classList.remove('drag');
  }));
  zone.addEventListener('drop', e => {
    const files = Array.from(e.dataTransfer.files || []);
    if(files.length) onFiles(files);
  });
  input.addEventListener('change', () => {
    const files = Array.from(input.files || []);
    if(files.length) onFiles(files);
    input.value = '';
  });
  if(window.__sharedFiles){
    const sf = window.__sharedFiles.filter(f => fileMatchesAccept(f, accept));
    window.__sharedFiles = null;
    if(sf.length) setTimeout(() => onFiles(multiple ? sf : sf.slice(0,1)), 0);
  }
  return zone;
}

/* Renders a file list with up/down/remove controls. items: [{name,size,...}] mutated in place. onChange called after any mutation. */
function buildFileList(items, {onChange, showSize}={}){
  const wrap = el('div', {class:'filelist'});
  function draw(){
    wrap.innerHTML = '';
    items.forEach((it, i) => {
      const row = el('div', {class:'file-item'}, [
        el('span', {class:'fname'}, [it.name]),
      ]);
      if(showSize !== false && it.size != null){
        row.appendChild(el('span', {class:'fsize'}, [fmtBytes(it.size)]));
      }
      const up = el('button', {class:'iconbtn', title:'เลื่อนขึ้น', html: ICONS.up});
      up.disabled = i===0;
      up.addEventListener('click', () => { [items[i-1],items[i]]=[items[i],items[i-1]]; draw(); onChange && onChange(); });
      const down = el('button', {class:'iconbtn', title:'เลื่อนลง', html: ICONS.down});
      down.disabled = i===items.length-1;
      down.addEventListener('click', () => { [items[i+1],items[i]]=[items[i],items[i+1]]; draw(); onChange && onChange(); });
      const rm = el('button', {class:'iconbtn', title:'ลบ', html: ICONS.close});
      rm.addEventListener('click', () => { items.splice(i,1); draw(); onChange && onChange(); });
      row.appendChild(up); row.appendChild(down); row.appendChild(rm);
      wrap.appendChild(row);
    });
  }
  draw();
  return {el: wrap, redraw: draw};
}

/* Interactive PDF page viewer for picking an x/y position (used by sign + stamp tools).
   pdfBytes: Uint8Array. onPageReady(pageIndex, pageWidthPt, pageHeightPt) optional.
   Returns {el, getState, setPage, addOverlay, clearOverlays, destroy} */
async function buildPagePlacer(pdfBytes, opts){
  opts = opts || {};
  const pdfjsDoc = await pdfjsFromBytes(pdfBytes);
  const numPages = pdfjsDoc.numPages;
  let current = 1;
  const wrap = el('div');
  const nav = el('div', {class:'pagenav'});
  const prevBtn = el('button', {class:'iconbtn', html: ICONS.prev});
  const nextBtn = el('button', {class:'iconbtn', html: ICONS.next});
  const label = el('span', {}, [`หน้า ${current} จาก ${numPages}`]);
  nav.appendChild(prevBtn); nav.appendChild(label); nav.appendChild(nextBtn);
  const placer = el('div', {class:'placer'});
  const img = el('img');
  placer.appendChild(img);
  wrap.appendChild(nav);
  wrap.appendChild(placer);
  if(numPages <= 1){ nav.style.display = 'none'; }

  let pageW=1, pageH=1;
  let markers = [];
  let onPick = opts.onPick || function(){};

  async function draw(){
    const canvas = await renderPageToCanvas(pdfjsDoc, current, 640);
    const page = await pdfjsDoc.getPage(current);
    const vp = page.getViewport({scale:1});
    pageW = vp.width; pageH = vp.height;
    img.src = canvas.toDataURL('image/png');
    label.textContent = `หน้า ${current} จาก ${numPages}`;
    renderMarkers();
    opts.onPageReady && opts.onPageReady(current, pageW, pageH);
  }
  function renderMarkers(){
    $$('.marker', placer).forEach(m => m.remove());
    markers.filter(m => m.page === current).forEach(m => {
      const d = el('div', {class:'marker', style:`left:${m.xr*100}%;top:${m.yr*100}%;`, html: m.html});
      placer.appendChild(d);
    });
  }
  placer.addEventListener('click', e => {
    const r = img.getBoundingClientRect();
    if(r.width === 0) return;
    const xr = (e.clientX - r.left) / r.width;
    const yr = (e.clientY - r.top) / r.height;
    onPick({page: current, xr, yr, pageW, pageH});
  });
  prevBtn.addEventListener('click', () => { if(current>1){ current--; draw(); }});
  nextBtn.addEventListener('click', () => { if(current<numPages){ current++; draw(); }});
  await draw();

  return {
    el: wrap,
    getCurrentPage: () => current,
    setMarker(m){ markers = [m]; renderMarkers(); },
    addMarker(m){ markers.push(m); renderMarkers(); },
    clearMarkers(){ markers = []; renderMarkers(); },
    numPages,
  };
}

/* Simple signature pad. Returns {el, clear, isEmpty, toPngDataUrl} */
function buildSignaturePad(){
  const wrap = el('div', {class:'sigpad-wrap'});
  const canvas = el('canvas', {width:420, height:160});
  wrap.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#20302C';
  let drawing = false, hasInk = false, last=null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX);
    const cy = (e.touches ? e.touches[0].clientY : e.clientY);
    return {x:(cx-r.left)*(canvas.width/r.width), y:(cy-r.top)*(canvas.height/r.height)};
  }
  function start(e){ e.preventDefault(); drawing = true; last = pos(e); }
  function move(e){
    if(!drawing) return; e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; hasInk = true;
  }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  return {
    el: wrap,
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasInk=false; },
    isEmpty(){ return !hasInk; },
    async loadImage(dataUrl){
      const im = await loadImage(dataUrl);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const k = Math.min((canvas.width-16)/im.width, (canvas.height-16)/im.height);
      const w = im.width*k, h = im.height*k;
      ctx.drawImage(im, (canvas.width-w)/2, (canvas.height-h)/2, w, h); hasInk = true;
    },
    toPngDataUrl(){ return canvas.toDataURL('image/png'); },
  };
}

/* ===================== Shared: Images -> PDF builder ===================== */
/* used by both "สแกนเอกสาร" and "JPG -> PDF" tools */
function buildImagesToPdfTool(container, {allowCamera, outNameBase}){
  let items = []; // {file, dataUrl, rotate, mode}
  const dzWrap = el('div', {class:'card'});
  container.appendChild(dzWrap);

  const captureRow = el('div', {class:'row', style:'margin-bottom:12px;'});
  if(allowCamera){
    const camInput = el('input', {type:'file', accept:'image/*', capture:'environment', style:'display:none'});
    const camBtn = el('button', {class:'btn'}, ['ถ่ายภาพเอกสาร']);
    camBtn.addEventListener('click', () => camInput.click());
    camInput.addEventListener('change', () => handleFiles(Array.from(camInput.files||[])).then(()=>camInput.value=''));
    captureRow.appendChild(camBtn);
    captureRow.appendChild(camInput);
  }
  const dz = buildDropzone({
    accept:'image/*', multiple:true,
    label: allowCamera ? 'หรือเลือกรูปจากเครื่อง (เลือกได้หลายภาพพร้อมกัน)' : 'ลากรูปมาวาง หรือแตะเพื่อเลือกรูป (เลือกได้หลายภาพ)',
    sub: 'เลือกจากเครื่อง',
    onFiles: handleFiles,
  });
  dzWrap.appendChild(captureRow);
  dzWrap.appendChild(dz);

  const gridWrap = el('div');
  container.appendChild(gridWrap);
  const actionWrap = el('div');
  container.appendChild(actionWrap);
  const resultWrap = el('div');
  container.appendChild(resultWrap);

  async function handleFiles(files){
    for(const f of files){
      if(!f.type.startsWith('image/')) continue;
      const dataUrl = await readAsDataURL(f);
      items.push({file:f, dataUrl, rotate:0, mode:'color'});
    }
    drawGrid();
  }

  function drawGrid(){
    gridWrap.innerHTML = '';
    actionWrap.innerHTML = '';
    if(items.length === 0) return;
    const grid = el('div', {class:'thumbgrid'});
    items.forEach((it, i) => {
      const img = el('img', {class:'thimg', src: it.dataUrl, style:`transform:rotate(${it.rotate}deg) ${it.mode==='bw'?'filter:grayscale(1) contrast(1.4);':it.mode==='gray'?'filter:grayscale(1);':''}`});
      const rotBtn = el('button', {class:'iconbtn', title:'หมุนภาพ', html: ICONS.rotate});
      rotBtn.addEventListener('click', () => { it.rotate = (it.rotate+90)%360; drawGrid(); });
      const delBtn = el('button', {class:'iconbtn', title:'ลบ', html: ICONS.close});
      delBtn.addEventListener('click', () => { items.splice(i,1); drawGrid(); });
      const modeSel = el('select', {style:'font-size:11px;padding:3px;border-radius:5px;border:1px solid var(--line);flex:1;'});
      [['color','สี'],['gray','ระดับเทา'],['bw','ขาวดำ']].forEach(([v,l]) => {
        const o = el('option', {value:v}, [l]); if(v===it.mode) o.selected = true; modeSel.appendChild(o);
      });
      modeSel.addEventListener('change', () => { it.mode = modeSel.value; drawGrid(); });
      const cell = el('div', {class:'thumb'}, [
        img,
        el('div', {class:'tctrl'}, [modeSel, rotBtn, delBtn]),
        el('div', {class:'tlabel'}, [`ภาพที่ ${i+1}`]),
      ]);
      grid.appendChild(cell);
    });
    gridWrap.appendChild(grid);
    const buildBtn = el('button', {class:'btn block'}, [`สร้างไฟล์ PDF (${items.length} หน้า)`]);
    buildBtn.addEventListener('click', buildPdf);
    actionWrap.appendChild(buildBtn);
  }

  async function processedJpegDataUrl(it){
    const img = await loadImage(it.dataUrl);
    const swap = it.rotate % 180 !== 0;
    const w = swap ? img.height : img.width;
    const h = swap ? img.width : img.height;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.translate(w/2, h/2);
    ctx.rotate(it.rotate * Math.PI/180);
    ctx.drawImage(img, -img.width/2, -img.height/2);
    ctx.restore();
    if(it.mode === 'gray' || it.mode === 'bw'){
      const imgData = ctx.getImageData(0,0,w,h);
      const d = imgData.data;
      for(let i=0;i<d.length;i+=4){
        let v = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        if(it.mode === 'bw') v = v > 150 ? 255 : (v < 90 ? 0 : v);
        d[i]=d[i+1]=d[i+2]=v;
      }
      ctx.putImageData(imgData,0,0);
    }
    return canvas.toDataURL('image/jpeg', 0.9);
  }

  async function buildPdf(){
    resultWrap.innerHTML = '';
    resultWrap.appendChild(el('div', {class:'note'}, [el('span',{class:'spinner'}), 'กำลังสร้างไฟล์ PDF...']));
    try{
      const pdfDoc = await PDFLib.PDFDocument.create();
      for(const it of items){
        const jpegUrl = await processedJpegDataUrl(it);
        const jpegBytes = await fetchPngBytesFromDataUrl(jpegUrl);
        const jpg = await pdfDoc.embedJpg(jpegBytes);
        const A4W = 595.28, A4H = 841.89;
        const isLandscape = jpg.width > jpg.height;
        const pageW = isLandscape ? A4H : A4W;
        const pageH = isLandscape ? A4W : A4H;
        const page = pdfDoc.addPage([pageW, pageH]);
        const margin = 18;
        const fit = fitInBox(jpg.width, jpg.height, pageW-margin*2, pageH-margin*2);
        page.drawImage(jpg, {
          x:(pageW-fit.width)/2, y:(pageH-fit.height)/2,
          width: fit.width, height: fit.height,
        });
      }
      const bytes = await pdfDoc.save();
      resultWrap.innerHTML = '';
      const box = el('div', {class:'result-box'}, [
        el('div', {class:'rtext'}, [
          el('div', {class:'rtitle'}, ['สร้างไฟล์ PDF เรียบร้อย']),
          el('div', {class:'rsub'}, [`${items.length} หน้า · ${fmtBytes(bytes.length)}`]),
        ]),
      ]);
      const dl = el('button', {class:'btn'}, ['ดาวน์โหลด PDF']);
      dl.addEventListener('click', () => downloadBytes(bytes, `${outNameBase||'เอกสาร'}-${niceDate()}.pdf`, 'application/pdf'));
      box.appendChild(dl);
      resultWrap.appendChild(box);
    }catch(err){
      console.error(err);
      resultWrap.innerHTML = '';
      resultWrap.appendChild(el('div', {class:'note warn'}, ['สร้างไฟล์ไม่สำเร็จ: ' + err.message]));
    }
  }
}

registerTool({
  id:'split', cat:'organize', icon:'split',
  name:'แยกไฟล์ PDF', desc:'ดึงเฉพาะหน้าที่ต้องการออกมาเป็นไฟล์ใหม่',
  longDesc:'เลือกไฟล์ PDF แล้วระบุช่วงหน้าที่ต้องการ ระบบจะสร้างไฟล์ PDF แยกให้ตามช่วงที่กำหนด',
  render(container){
    let srcFile=null, srcBuf=null, pageCount=0;
    const dz = buildDropzone({
      accept:'application/pdf', multiple:false,
      label:'เลือกไฟล์ PDF ที่ต้องการแยกหน้า', sub:'เลือกไฟล์ PDF',
      onFiles: async (files) => {
        const f = files[0]; if(!f) return;
        srcFile = f;
        srcBuf = await readAsArrayBuffer(f);
        try{
          const doc = await PDFLib.PDFDocument.load(srcBuf, {ignoreEncryption:true});
          pageCount = doc.getPageCount();
          drawForm();
        }catch(err){
          toast('เปิดไฟล์ไม่สำเร็จ: ' + err.message, true);
        }
      }
    });
    container.appendChild(el('div', {class:'card'}, [dz]));
    const formWrap = el('div');
    container.appendChild(formWrap);
    const resultWrap = el('div');
    container.appendChild(resultWrap);

    function drawForm(){
      formWrap.innerHTML = '';
      resultWrap.innerHTML = '';
      const card = el('div', {class:'card'});
      card.appendChild(el('div', {class:'note'}, [`ไฟล์ "${srcFile.name}" มีทั้งหมด ${pageCount} หน้า`]));
      const field = el('div', {class:'field'}, [
        el('label', {}, ['ระบุช่วงหน้าที่ต้องการแยก ', el('span',{class:'hint'},['(เช่น 1-3,5,7-8 — คั่นด้วยจุลภาคเพื่อสร้างหลายไฟล์)'])]),
        el('input', {type:'text', id:'splitRange', placeholder:`เช่น 1-${Math.min(3,pageCount)}`}),
      ]);
      card.appendChild(field);
      const rowBtns = el('div', {class:'row'});
      const goBtn = el('button', {class:'btn'}, ['แยกไฟล์ตามช่วงที่ระบุ']);
      const eachBtn = el('button', {class:'btn secondary'}, ['แยกทุกหน้าเป็นไฟล์เดี่ยว']);
      rowBtns.appendChild(goBtn); rowBtns.appendChild(eachBtn);
      card.appendChild(rowBtns);
      formWrap.appendChild(card);
      goBtn.addEventListener('click', () => {
        const raw = $('#splitRange').value.trim();
        if(!raw){ toast('กรุณาระบุช่วงหน้า', true); return; }
        const groups = parseRanges(raw, pageCount);
        if(!groups){ toast('รูปแบบช่วงหน้าไม่ถูกต้อง', true); return; }
        runSplit(groups);
      });
      eachBtn.addEventListener('click', () => {
        const groups = [];
        for(let i=1;i<=pageCount;i++) groups.push([i]);
        runSplit(groups);
      });
    }
    function parseRanges(raw, max){
      const parts = raw.split(',').map(s=>s.trim()).filter(Boolean);
      const groups = [];
      for(const p of parts){
        const m = p.match(/^(\d+)(?:-(\d+))?$/);
        if(!m) return null;
        let a = parseInt(m[1],10), b = m[2] ? parseInt(m[2],10) : a;
        if(a>b) [a,b]=[b,a];
        if(a<1 || b>max) return null;
        const g = [];
        for(let i=a;i<=b;i++) g.push(i);
        groups.push(g);
      }
      return groups.length ? groups : null;
    }
    async function runSplit(groups){
      resultWrap.innerHTML = '';
      resultWrap.appendChild(el('div', {class:'note'}, [el('span',{class:'spinner'}), 'กำลังแยกไฟล์...']));
      try{
        const results = [];
        for(const g of groups){
          const out = await PDFLib.PDFDocument.create();
          const src = await PDFLib.PDFDocument.load(srcBuf, {ignoreEncryption:true});
          const pages = await out.copyPages(src, g.map(n=>n-1));
          pages.forEach(p => out.addPage(p));
          const bytes = await out.save();
          const label = g.length===1 ? `หน้า ${g[0]}` : `หน้า ${g[0]}-${g[g.length-1]}`;
          results.push({label, bytes});
        }
        resultWrap.innerHTML = '';
        resultWrap.appendChild(el('div', {class:'note'}, [`แยกไฟล์สำเร็จ ${results.length} ไฟล์`]));
        results.forEach((r,i) => {
          const box = el('div', {class:'result-box'}, [
            el('div', {class:'rtext'}, [
              el('div', {class:'rtitle'}, [r.label]),
              el('div', {class:'rsub'}, [fmtBytes(r.bytes.length)]),
            ]),
          ]);
          const dl = el('button', {class:'btn'}, ['ดาวน์โหลด']);
          dl.addEventListener('click', () => downloadBytes(r.bytes, `${srcFile.name.replace(/\.pdf$/i,'')}-${r.label.replace(/\s/g,'')}.pdf`, 'application/pdf'));
          box.appendChild(dl);
          resultWrap.appendChild(box);
        });
      }catch(err){
        console.error(err);
        resultWrap.innerHTML = '';
        resultWrap.appendChild(el('div', {class:'note warn'}, ['แยกไฟล์ไม่สำเร็จ: ' + err.message]));
      }
    }
  }
});

        resultWrap.innerHTML = '';
        resultWrap.appendChild(el('div', {class:'note warn'}, ['บันทึกไม่สำเร็จ: ' + err.message]));
      }
    }

/* ===================== DOCX builder (no library) ===================== */
const DocxLib = (() => {
  const enc = new TextEncoder();
  let crcTable = null;
  function crc32(u8){
    if(!crcTable){ crcTable = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; crcTable[n]=c>>>0; } }
    let c = 0xFFFFFFFF;
    for(let i=0;i<u8.length;i++) c = crcTable[(c^u8[i])&255] ^ (c>>>8);
    return (c^0xFFFFFFFF)>>>0;
  }
  function zip(files, type){ // files: [{name, data:Uint8Array}] stored (no compression)
    const parts = [], central = []; let offset = 0;
    const now = new Date();
    const dosTime = (now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
    const dosDate = ((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
    for(const f of files){
      const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
      lh.setUint16(8,0,true); lh.setUint16(10,dosTime,true); lh.setUint16(12,dosDate,true);
      lh.setUint32(14,crc,true); lh.setUint32(18,size,true); lh.setUint32(22,size,true);
      lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
      parts.push(new Uint8Array(lh.buffer), name, f.data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
      ch.setUint16(10,0,true); ch.setUint16(12,dosTime,true); ch.setUint16(14,dosDate,true);
      ch.setUint32(16,crc,true); ch.setUint32(20,size,true); ch.setUint32(24,size,true);
      ch.setUint16(28,name.length,true); ch.setUint32(42,offset,true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + size;
    }
    let cdSize = 0; central.forEach(p => cdSize += p.length);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
    end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)],
      {type: type || 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  }
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
  const FONT = 'Tahoma';
  function runXml(text, sz, bold){
    const rpr = `<w:rPr><w:rFonts w:ascii="${FONT}" w:hAnsi="${FONT}" w:cs="${FONT}" w:eastAsia="${FONT}"/>${bold?'<w:b/><w:bCs/>':''}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr>`;
    const segs = text.split('\t'); let out = '';
    segs.forEach((s,i) => { if(i>0) out += `<w:r>${rpr}<w:tab/></w:r>`; if(s) out += `<w:r>${rpr}<w:t xml:space="preserve">${esc(s)}</w:t></w:r>`; });
    return out;
  }
  // blocks: {type:'p', text, sz, bold, pageBreakBefore, after} | {type:'img', rid, wEmu, hEmu, id, pageBreakBefore}
  // opts: pageW, pageH (twips), margin (twips)
  function build(blocks, images, opts){
    const m = opts.margin;
    let body = '';
    for(const b of blocks){
      if(b.type==='p'){
        body += `<w:p><w:pPr>${b.pageBreakBefore?'<w:pageBreakBefore/>':''}<w:spacing w:before="0" w:after="${b.after??120}" w:line="${b.line??276}" w:lineRule="auto"/>${b.ind>8?`<w:ind w:left="${Math.min(6000,Math.round(b.ind*20))}"/>`:''}</w:pPr>${runXml(b.text,b.sz||28,b.bold)}</w:p>`;
      } else if(b.type==='img'){
        body += `<w:p><w:pPr>${b.pageBreakBefore?'<w:pageBreakBefore/>':''}<w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:rPr><w:sz w:val="2"/></w:rPr></w:pPr><w:r><w:rPr><w:sz w:val="2"/></w:rPr><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${b.wEmu}" cy="${b.hEmu}"/><wp:docPr id="${b.id}" name="Page ${b.id}"/><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${b.id}" name="page${b.id}.jpg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${b.rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${b.wEmu}" cy="${b.hEmu}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
      }
    }
    const sect = `<w:sectPr><w:pgSz w:w="${opts.pageW}" w:h="${opts.pageH}"/><w:pgMar w:top="${m}" w:right="${m}" w:bottom="${m}" w:left="${m}" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr>`;
    const docXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${NS}><w:body>${body}${sect}</w:body></w:document>`;
    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="${FONT}" w:hAnsi="${FONT}" w:cs="${FONT}" w:eastAsia="${FONT}"/><w:sz w:val="28"/><w:szCs w:val="28"/><w:lang w:val="en-US" w:bidi="th-TH"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`;
    let rels = `<Relationship Id="rIdSt" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`;
    const files = [];
    images.forEach(im => { rels += `<Relationship Id="${im.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${im.name}"/>`; files.push({name:'word/media/'+im.name, data:im.data}); });
    const enc2 = s => enc.encode(s);
    return zip([
      {name:'[Content_Types].xml', data:enc2(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`)},
      {name:'_rels/.rels', data:enc2(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`)},
      {name:'word/document.xml', data:enc2(docXml)},
      {name:'word/styles.xml', data:enc2(styles)},
      {name:'word/_rels/document.xml.rels', data:enc2(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels}</Relationships>`)},
      ...files,
    ]);
  }
  return {build, zip};
})();

/* Group pdf.js text items of one page into paragraphs */
function pdfTextToParagraphs(items, pageH){
  const isThai = ch => /[฀-๿]/.test(ch);
  const lines = []; let cur = null;
  for(const it of items){
    if(!it.str && !it.hasEOL) continue;
    const x = it.transform[4], y = it.transform[5];
    const h = Math.abs(it.transform[3]) || it.height || 10;
    if(!it.str.trim() && !cur) continue;
    if(!cur || Math.abs(y - cur.y) > Math.max(h,cur.h)*0.45){
      cur = {y, h, x0:x, endX:x, text:'', hs:[]};
      lines.push(cur);
    }
    if(it.str){
      const gap = x - cur.endX;
      if(cur.text){
        const last = cur.text.slice(-1), first = it.str[0];
        if(gap > h*1.8) cur.text += '\t';
        else if(gap > h*0.18 && !isThai(last) && !isThai(first) && !/\s$/.test(cur.text) && !/^\s/.test(it.str)) cur.text += ' ';
      }
      cur.text += it.str; cur.hs.push(h*it.str.length);
      cur.endX = Math.max(cur.endX, x + (it.width||0));
      cur.h = h;
    }
  }
  const ls = lines.filter(l => l.text.trim());
  if(!ls.length) return [];
  const maxEnd = Math.max(...ls.map(l=>l.endX)), minX = Math.min(...ls.map(l=>l.x0));
  const paras = [];
  let p = null, prev = null;
  for(const l of ls){
    const sz = Math.max(16, Math.min(96, Math.round(l.h*2*0.98)));
    const gap = prev ? (prev.y - l.y) : 0;
    const wrapped = prev && gap > 0 && gap < l.h*1.7 && prev.endX > minX + (maxEnd-minX)*0.82 && !prev.text.includes('\t') && Math.abs(prev.h - l.h) < 1.5 && Math.abs(l.x0 - prev.x0) < l.h*3;
    if(wrapped && p){
      const j = (isThai(p.text.slice(-1)) || isThai(l.text[0])) ? '' : ' ';
      p.text += j + l.text.trim();
    } else {
      const indent = Math.max(0, Math.round(l.x0 - minX));
      p = {type:'p', text: l.text.replace(/\s+$/,''), sz, after: prev && gap > l.h*2.2 ? 240 : 80, ind: indent};
      paras.push(p);
    }
    prev = l;
  }
  return paras;
}

/* ===================== Lazy script loader ===================== */
const _scriptLoads = {};
function loadScriptOnce(url){
  if(!_scriptLoads[url]) _scriptLoads[url] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = url; s.async = true;
    s.onload = () => res(); s.onerror = () => { delete _scriptLoads[url]; rej(new Error('โหลดไลบรารีไม่สำเร็จ (ครั้งแรกต้องต่ออินเทอร์เน็ต)')); };
    document.head.appendChild(s);
  });
  return _scriptLoads[url];
}

      sel.value = lang; sel.addEventListener('change', () => lang = sel.value);

    }
    async function collectImages(status){
      const imgs = []; // {canvas, wPt, hPt}
      for(const f of files){
        if(/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)){
          const d = await pdfjsFromBytes(new Uint8Array(await readAsArrayBuffer(f)));
          for(let i=1;i<=d.numPages;i++){
            status(`กำลังเตรียมหน้า ${i}/${d.numPages} ของ ${f.name}`);
            const p = await d.getPage(i), v = p.getViewport({scale:1});
            const c = await renderPageToCanvas(d, i, Math.min(2400, Math.max(1600, v.width*300/72)));
            imgs.push({canvas:c, wPt:v.width, hPt:v.height});
          }
        } else {
          const im = await loadImage(await readAsDataURL(f));
          const k = Math.min(1, 2600 / Math.max(im.width, im.height));
          const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im, 0, 0, c.width, c.height);
          // fit photo onto A4-ish page width 595pt
          imgs.push({canvas:c, wPt:595, hPt:595*c.height/c.width});
        }
      }
      return imgs;
    }
    async function run(){

      status.appendChild(bar);
      resultWrap.appendChild(status);
      const say = t => status.children[1].textContent = t;
      const prog = p => bar.firstChild.style.width = Math.round(p*100) + '%';
      let worker = null;
      try{
        await loadScriptOnce(LIBS.tesseract);
        const imgs = await collectImages(say);
        let pageNo = 0;
        say('กำลังโหลดข้อมูลภาษา (ครั้งแรกอาจใช้เวลาสักครู่)...');
        worker = await Tesseract.createWorker(lang.split('+'), 1, {
          logger: m => { if(m.status === 'recognizing text') { say(`กำลังอ่านหน้า ${pageNo}/${imgs.length}...`); prog(((pageNo-1) + m.progress)/imgs.length); }
                         else if(/loading|initializ/.test(m.status) && m.progress != null) prog(m.progress); },
        });
        await worker.setParameters({preserve_interword_spaces: '1'});
        const pagesText = [], pdfParts = [];
        for(const im of imgs){
          pageNo++;
          const {data} = await worker.recognize(im.canvas, {}, {text:true, blocks:true, pdf:makePdf});
          let t = (data.text || '');
          // rebuild from lines, dropping low-confidence noise (e.g. stray vowel marks read as a separate line)
          if(data.blocks && data.blocks.length){
            const confs = []; data.blocks.forEach(b => (b.paragraphs||[]).forEach(p => (p.lines||[]).forEach(l => confs.push(l.confidence))));
            confs.sort((a,b) => a-b);
            const cut = Math.max(45, (confs[Math.floor(confs.length/2)] || 0) - 30);
            const bl = data.blocks.map(b => (b.paragraphs||[]).map(p => (p.lines||[])
              .filter(l => l.confidence >= cut || (l.confidence >= 30 && l.text.replace(/\s/g,'').length > 12))
              .map(l => l.text.replace(/\s+$/,'')).join('\n')).filter(Boolean).join('\n\n')).filter(Boolean);
            if(bl.join('').replace(/\s/g,'').length > 0) t = bl.join('\n\n');
          }
          t = t.replace(/\u0E4D\u0E32/g, '\u0E33');
          pagesText.push(t.trim());
          if(makePdf && data.pdf) pdfParts.push({bytes: new Uint8Array(data.pdf), wPt: im.wPt, hPt: im.hPt});
        }
        await worker.terminate(); worker = null;
        prog(1);
        const base = (files.length === 1 ? files[0].name.replace(/\.\w+$/, '') : 'OCR-' + niceDate());
        const fullText = pagesText.join('\n\n');
        resultWrap.innerHTML = '';
        if(!fullText.replace(/\s/g,'')){ resultWrap.appendChild(el('div', {class:'note warn'}, ['อ่านไม่พบตัวหนังสือ ลองใช้รูปที่ชัดขึ้น หรือถ่ายให้ตรงและสว่างกว่านี้'])); return; }
        const ta = el('textarea', {style:'width:100%;min-height:220px;font-family:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:8px;box-sizing:border-box;'});
        ta.value = fullText;
        const card = el('div', {class:'card'}, [el('div', {class:'note'}, [`อ่านได้ ${fullText.replace(/\s/g,'').length.toLocaleString()} ตัวอักษร จาก ${pagesText.length} หน้า — ตรวจทานและแก้คำผิดในกล่องนี้ได้ก่อนดาวน์โหลด`]), ta]);
        const row = el('div', {class:'row', style:'margin-top:10px;'});
        const cp = el('button', {class:'btn secondary'}, ['คัดลอกข้อความ']);
        cp.addEventListener('click', async () => { try{ await navigator.clipboard.writeText(ta.value); toast('คัดลอกแล้ว'); }catch(e){ ta.select(); document.execCommand('copy'); toast('คัดลอกแล้ว'); } });
        const dw = el('button', {class:'btn'}, ['ดาวน์โหลด Word']);
        dw.addEventListener('click', () => {
          const blocks = [];
          ta.value.split(/\n{2,}/).forEach(p => { if(p.trim()) blocks.push({type:'p', text:p.replace(/\n/g, ' ').replace(/ {2,}/g,' ').trim(), sz:28, after:160}); });
          downloadBlob(DocxLib.build(blocks, [], {pageW:11906, pageH:16838, margin:1134}), base + '-OCR.docx');
        });
        const dt = el('button', {class:'btn secondary'}, ['ดาวน์โหลด .txt']);
        dt.addEventListener('click', () => downloadBlob(new Blob(['﻿' + ta.value], {type:'text/plain;charset=utf-8'}), base + '-OCR.txt'));
        row.append(dw, cp, dt);
        card.appendChild(row);
        resultWrap.appendChild(card);
        if(pdfParts.length){
          const out = await PDFLib.PDFDocument.create();
          for(const part of pdfParts){
            const [emb] = await out.embedPdf(part.bytes, [0]);
            const p = out.addPage([part.wPt, part.hPt]);
            p.drawPage(emb, {x:0, y:0, width:part.wPt, height:part.hPt});
          }
          const bytes = await out.save();
          const box = el('div', {class:'result-box'}, [el('div', {class:'rtext'}, [el('div', {class:'rtitle'}, [base + '-ค้นหาได้.pdf']), el('div', {class:'rsub'}, [`${fmtBytes(bytes.length)} • หน้าตาเหมือนเดิม แต่ค้นหา/คัดลอกคำได้`])])]);
          const dl = el('button', {class:'btn'}, ['ดาวน์โหลด PDF']);
          dl.addEventListener('click', () => downloadBytes(bytes, base + '-ค้นหาได้.pdf', 'application/pdf'));
          box.appendChild(dl); resultWrap.appendChild(box);
        }
      }catch(err){
        console.error(err); if(worker) try{ await worker.terminate(); }catch(e){}
        resultWrap.innerHTML = ''; resultWrap.appendChild(el('div', {class:'note warn'}, ['อ่านข้อความไม่สำเร็จ: ' + (err.message || err)]));
      }
    }
  }
});

/* ===================== Word / Excel → PDF ===================== */
registerTool({
  id:'office2pdf', cat:'convert', icon:'office2pdf',
  name:'Word / Excel → PDF', desc:'แปลงไฟล์ .docx .xlsx .xls .csv เป็น PDF',
  longDesc:'แปลงเอกสาร Word (.docx) หรือตาราง Excel (.xlsx .xls .csv) เป็นไฟล์ PDF ในเครื่อง เหมาะกับเอกสารทั่วไป ข้อความ ตาราง และรูปภาพ แต่หัว/ท้ายกระดาษ กล่องข้อความ และการจัดหน้าซับซ้อนอาจไม่เหมือนใน Office 100% (ครั้งแรกต้องต่ออินเทอร์เน็ตเพื่อโหลดตัวแปลง)',
  render(container){
    let srcFile = null, orient = 'portrait', sheetsSel = null, wb = null, docHtml = null;
    const dz = buildDropzone({accept:'.docx,.xlsx,.xls,.csv,.ods,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv', multiple:false,
      label:'เลือกไฟล์ Word (.docx) หรือ Excel (.xlsx / .xls / .csv)', sub:'เลือกไฟล์',
      onFiles: async (fs) => { srcFile = fs[0]; await load(); }});
    container.appendChild(el('div', {class:'card'}, [dz]));
    const formWrap = el('div'), resultWrap = el('div');
    container.appendChild(formWrap); container.appendChild(resultWrap);
    const isWord = () => /\.docx$/i.test(srcFile.name);
    async function load(){
      formWrap.innerHTML = ''; resultWrap.innerHTML = ''; wb = null; docHtml = null;
      formWrap.appendChild(el('div', {class:'note'}, [el('span',{class:'spinner'}), 'กำลังเปิดไฟล์...']));
      try{
        const buf = await readAsArrayBuffer(srcFile);
        if(isWord()){
          if(/\.doc$/i.test(srcFile.name)) throw new Error('รองรับเฉพาะ .docx (ไฟล์ .doc แบบเก่าให้ Save As เป็น .docx ก่อน)');
          await loadScriptOnce(LIBS.mammoth);
          const r = await mammoth.convertToHtml({arrayBuffer: buf}, {includeDefaultStyleMap:true});
          docHtml = r.value; orient = 'portrait';
        } else {
          await loadScriptOnce(LIBS.xlsx);
          wb = XLSX.read(buf, {type:'array', cellStyles:false, cellDates:true});
          sheetsSel = new Set(wb.SheetNames.slice(0,1).concat(wb.SheetNames.length <= 5 ? wb.SheetNames : []));
          orient = 'landscape';
        }
        drawUI();
      }catch(err){ console.error(err); formWrap.innerHTML = ''; formWrap.appendChild(el('div', {class:'note warn'}, ['เปิดไฟล์ไม่สำเร็จ: ' + err.message])); }
    }
    let preview = null;
    function buildContent(){
      const pageWpx = orient === 'portrait' ? 794 : 1123, pad = 57;
      const wrap = el('div', {class:'o2p-doc', style:`width:${pageWpx}px;padding:${pad}px;box-sizing:border-box;background:#fff;color:#000;font-family:Sarabun,'Noto Sans Thai',Tahoma,sans-serif;font-size:15px;line-height:1.5;`});
      if(docHtml != null){ wrap.innerHTML = docHtml; }
      else {
        wb.SheetNames.filter(n => sheetsSel.has(n)).forEach((n, i) => {
          if(sheetsSel.size > 1) wrap.appendChild(el('div', {style:`font-weight:700;font-size:16px;margin:${i?'26px':'0'} 0 8px;`}, [n]));
          const holder = el('div'); holder.innerHTML = XLSX.utils.sheet_to_html(wb.Sheets[n], {header:'', footer:''});
          const t = holder.querySelector('table'); if(t) wrap.appendChild(t);
        });
      }
      return wrap;
    }
    const docCss = `.o2p-doc img{max-width:100%;height:auto}.o2p-doc table{border-collapse:collapse;margin:6px 0}.o2p-doc td,.o2p-doc th{border:1px solid #9a9a9a;padding:3px 6px;vertical-align:top;white-space:nowrap}.o2p-doc p{margin:0 0 8px}.o2p-doc h1{font-size:24px;margin:10px 0}.o2p-doc h2{font-size:20px;margin:10px 0}.o2p-doc h3{font-size:17px}`;
    function fitTables(wrap){
      const avail = wrap.clientWidth - 114;
      wrap.querySelectorAll('table').forEach(t => {
        let fs = 15; t.style.fontSize = fs + 'px';
        while(t.scrollWidth > avail && fs > 6){ fs -= 0.5; t.style.fontSize = fs + 'px'; }
        if(t.scrollWidth > avail) t.querySelectorAll('td,th').forEach(c => { c.style.whiteSpace = 'normal'; });
      });
    }
    function drawUI(){
      formWrap.innerHTML = ''; resultWrap.innerHTML = '';
      const card = el('div', {class:'card'});
      card.appendChild(el('div', {class:'note'}, [`ไฟล์: ${srcFile.name}`]));
      if(wb && wb.SheetNames.length > 1){
        const box = el('div', {class:'field'}, [el('label', {}, ['ชีตที่จะแปลง'])]);
        wb.SheetNames.forEach(n => { const c = el('input', {type:'checkbox'}); c.checked = sheetsSel.has(n);
          c.addEventListener('change', () => { c.checked ? sheetsSel.add(n) : sheetsSel.delete(n); renderPreview(); });
          box.appendChild(el('label', {style:'display:flex;gap:8px;align-items:center;font-weight:normal;margin:4px 0;'}, [c, n])); });
        card.appendChild(box);
      }
      const seg = el('div', {class:'seg', style:'margin-bottom:12px;'});
      [['portrait','แนวตั้ง A4'],['landscape','แนวนอน A4']].forEach(([v,l]) => { const b = el('button', {type:'button', class: orient===v?'active':''}, [l]);
        b.addEventListener('click', () => { orient = v; drawUI(); }); seg.appendChild(b); });
      card.appendChild(seg);
      card.appendChild(el('div', {class:'note'}, ['ตัวอย่าง (เลื่อนดูได้):']));
      preview = el('div', {style:'overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:8px;background:#e9e7e1;padding:8px;'});
      card.appendChild(preview);
      formWrap.appendChild(card);
      const go = el('button', {class:'btn block'}, ['แปลงเป็น PDF']);
      go.addEventListener('click', convert);
      const pr = el('button', {class:'btn block secondary', style:'margin-top:8px;'}, ['พิมพ์ / บันทึกเป็น PDF ผ่านเครื่องพิมพ์ (ตัวหนังสือคมชัดที่สุด)']);
      pr.addEventListener('click', printIt);
      formWrap.append(go, pr);
      renderPreview();
    }
    function renderPreview(){
      preview.innerHTML = '';
      preview.appendChild(el('style', {}, [docCss]));
      const c = buildContent(); preview.appendChild(c); fitTables(c);
    }
    async function convert(){
      resultWrap.innerHTML = '';
      const status = el('div', {class:'note'}, [el('span',{class:'spinner'}), el('span', {}, ['กำลังแปลง...'])]);
      resultWrap.appendChild(status);
      // render in a full-size off-screen host (not clipped/scrolled)
      const host = el('div', {style:'position:absolute;left:0;top:0;z-index:-1;pointer-events:none;'});
      host.appendChild(el('style', {}, [docCss]));
      const docEl = buildContent(); host.appendChild(docEl);
      document.body.appendChild(host);
      try{
        await loadScriptOnce(LIBS.html2canvas);
        try{ await document.fonts.ready; }catch(e){}
        await Promise.all(Array.from(docEl.querySelectorAll('img')).map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
        fitTables(docEl);
        const W = docEl.offsetWidth, pageH = Math.round(W * (orient==='portrait' ? 842/595 : 595/842));
        const pad = 57, bodyH = pageH - pad*2;
        const total = docEl.scrollHeight - pad*2;
        // candidate break points: bottoms of block-level things (relative to content top)
        const top0 = docEl.getBoundingClientRect().top + pad;
        const cands = new Set();
        docEl.querySelectorAll('p,li,tr,h1,h2,h3,h4,h5,h6,img,table,div,br').forEach(n => { const r = n.getBoundingClientRect(); if(r.height) cands.add(Math.round(r.bottom - top0)); });
        const sorted = [...cands].filter(v => v > 0).sort((a,b) => a-b);
        const breaks = [0];
        while(breaks[breaks.length-1] + bodyH < total){
          const s = breaks[breaks.length-1], lim = s + bodyH;
          let best = null; for(const v of sorted){ if(v > s + bodyH*0.35 && v <= lim) best = v; }
          breaks.push(best || lim);
        }
        breaks.push(total);
        const out = await PDFLib.PDFDocument.create();
        const pw = orient==='portrait' ? 595.28 : 841.89, ph = orient==='portrait' ? 841.89 : 595.28, k = pw / W;
        const scale = Math.min(2, (window.devicePixelRatio||1) * 1.5);
        const docRect = docEl.getBoundingClientRect();
        for(let i=0;i<breaks.length-1;i++){
          status.children[1].textContent = `กำลังสร้างหน้า ${i+1}/${breaks.length-1}...`;
          const y0 = breaks[i], h = breaks[i+1] - breaks[i];
          if(h <= 2) continue;
          const canvas = await html2canvas(docEl, {scale, backgroundColor:'#ffffff', useCORS:true, logging:false,
            x: docRect.left + window.scrollX + pad, y: docRect.top + window.scrollY + pad + y0, width: W - pad*2, height: h,
            windowWidth: Math.max(document.documentElement.clientWidth, W + 20)});
          const jpg = await out.embedJpg(await fetchPngBytesFromDataUrl(canvas.toDataURL('image/jpeg', 0.92)));
          const page = out.addPage([pw, ph]);
          page.drawImage(jpg, {x: pad*k, y: ph - pad*k - h*k, width: (W - pad*2)*k, height: h*k});
        }
        const bytes = await out.save();
        const name = srcFile.name.replace(/\.\w+$/, '') + '.pdf';
        resultWrap.innerHTML = '';
        const box = el('div', {class:'result-box'}, [el('div', {class:'rtext'}, [el('div', {class:'rtitle'}, [name]), el('div', {class:'rsub'}, [`${out.getPageCount()} หน้า • ${fmtBytes(bytes.length)}`])])]);
        const dl = el('button', {class:'btn'}, ['ดาวน์โหลด PDF']);
        dl.addEventListener('click', () => downloadBytes(bytes, name, 'application/pdf'));
        box.appendChild(dl); resultWrap.appendChild(box);
        resultWrap.appendChild(el('div', {class:'note'}, ['ไฟล์นี้เก็บหน้าเป็นภาพ (ค้นหาคำไม่ได้) ถ้าต้องการให้คัดลอกข้อความได้ ให้ใช้ปุ่ม "พิมพ์ / บันทึกเป็น PDF"']));
      }catch(err){ console.error(err); resultWrap.innerHTML = ''; resultWrap.appendChild(el('div', {class:'note warn'}, ['แปลงไม่สำเร็จ: ' + err.message])); }
      finally{ host.remove(); }
    }
    function printIt(){
      const c = buildContent();
      const ifr = el('iframe', {style:'position:fixed;right:0;bottom:0;width:0;height:0;border:0;'});
      document.body.appendChild(ifr);
      const d = ifr.contentDocument;
      d.open(); d.write(`<!doctype html><html><head><meta charset="utf-8"><title>${srcFile.name.replace(/\.\w+$/, '')}</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet"><style>@page{size:A4 ${orient};margin:15mm}body{margin:0}${docCss}.o2p-doc{width:auto!important;padding:0!important}tr,img{page-break-inside:avoid}</style></head><body></body></html>`); d.close();
      d.body.appendChild(d.importNode(c, true));
      const go = () => { try{ ifr.contentWindow.focus(); ifr.contentWindow.print(); }catch(e){ toast('เปิดหน้าพิมพ์ไม่ได้', true); } setTimeout(() => ifr.remove(), 60000); };
      (d.fonts ? d.fonts.ready : Promise.resolve()).then(() => setTimeout(go, 300));
    }
  }
});

/* ===================== ลดขนาดไฟล์ภาพ ===================== */
registerTool({
  id:'imgshrink', cat:'convert', icon:'imgshrink',
  name:'ลดขนาดไฟล์ภาพ', desc:'บีบอัด JPG/PNG ให้ไฟล์เล็กลงโดยยังดูดีอยู่',
  longDesc:'เลือกรูปภาพที่ไฟล์ใหญ่เกินไป ปรับความกว้างสูงสุดและคุณภาพ แล้วดาวน์โหลดไฟล์ที่เล็กลง',
  render(container){
    let items = [];
    let maxWidth = 1600, quality = 0.75;
    const dz = buildDropzone({
      accept:'image/*', multiple:true,
      label:'เลือกรูปภาพที่ต้องการบีบอัด (เลือกได้หลายไฟล์)', sub:'เลือกรูปภาพ',
      onFiles: async (files) => {
        for(const f of files){ items.push({file:f, name:f.name, size:f.size}); }
        drawUI();
      }
    });
    container.appendChild(el('div', {class:'card'}, [dz]));
    const formWrap = el('div'); container.appendChild(formWrap);
    const resultWrap = el('div'); container.appendChild(resultWrap);

    function drawUI(){
      formWrap.innerHTML = '';
      resultWrap.innerHTML = '';
      if(items.length===0) return;
      const card = el('div', {class:'card'});
      card.appendChild(el('div', {class:'note'}, [`เลือกไว้ ${items.length} ไฟล์`]));
      const wField = el('div', {class:'field'}, [
        el('label', {}, [`ความกว้างสูงสุด: ${maxWidth}px`]),
        el('input', {type:'range', min:'600', max:'2400', step:'100', value:String(maxWidth)}),
      ]);
      wField.querySelector('input').addEventListener('input', e => { maxWidth = +e.target.value; wField.querySelector('label').textContent = `ความกว้างสูงสุด: ${maxWidth}px`; });
      const qField = el('div', {class:'field'}, [
        el('label', {}, [`คุณภาพ: ${Math.round(quality*100)}%`]),
        el('input', {type:'range', min:'30', max:'95', step:'5', value:String(Math.round(quality*100))}),
      ]);
      qField.querySelector('input').addEventListener('input', e => { quality = (+e.target.value)/100; qField.querySelector('label').textContent = `คุณภาพ: ${Math.round(quality*100)}%`; });
      card.appendChild(wField); card.appendChild(qField);
      const goBtn = el('button', {class:'btn block'}, ['บีบอัดรูปภาพ']);
      goBtn.addEventListener('click', doShrink);
      card.appendChild(goBtn);
      formWrap.appendChild(card);
    }
    async function doShrink(){
      resultWrap.innerHTML = '';
      resultWrap.appendChild(el('div', {class:'note'}, [el('span',{class:'spinner'}), 'กำลังบีบอัด...']));
      const outputs = [];
      for(const it of items){
        const dataUrl = await readAsDataURL(it.file);
        const img = await loadImage(dataUrl);
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const url = canvas.toDataURL('image/jpeg', quality);
        const bytes = await fetchPngBytesFromDataUrl(url);
        outputs.push({name: it.name.replace(/\.\w+$/, '') + '.jpg', bytes, before: it.size});
      }
      resultWrap.innerHTML = '';
      outputs.forEach(o => {
        const pct = Math.round((1 - o.bytes.length/o.before)*100);
        const box = el('div', {class:'result-box'}, [
          el('div', {class:'rtext'}, [
            el('div', {class:'rtitle'}, [o.name]),
            el('div', {class:'rsub'}, [`${fmtBytes(o.before)} → ${fmtBytes(o.bytes.length)}` + (pct>0?` (เล็กลง ${pct}%)`:'')]),
          ]),
        ]);
        const dl = el('button', {class:'btn'}, ['ดาวน์โหลด']);
        dl.addEventListener('click', () => downloadBlob(new Blob([o.bytes], {type:'image/jpeg'}), o.name));
        box.appendChild(dl);
        resultWrap.appendChild(box);
      });
    }
  }
});

const STAMP_KEY = 'pdftools.stamps';
function getStamps(){ try{ return JSON.parse(localStorage.getItem(STAMP_KEY) || '[]'); }catch(e){ return []; } }
function setStamps(a){ try{ localStorage.setItem(STAMP_KEY, JSON.stringify(a)); return true; }catch(e){ toast('พื้นที่จัดเก็บเต็ม บันทึกไม่ได้', true); return false; } }
function thaiDate(d){ return (d||new Date()).toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'numeric'}); }
function thaiTime(d){ return (d||new Date()).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'}) + ' น.'; }
/* parse "1,3-5" -> Set of page numbers (1-based) */
function parsePageList(s, n){
  const out = new Set();
  String(s||'').split(/[,\s]+/).filter(Boolean).forEach(part => {
    const m = part.match(/^(\d+)(?:-(\d+))?$/); if(!m) return;
    let a = +m[1], b = m[2] ? +m[2] : a; if(a>b) [a,b] = [b,a];
    for(let i=Math.max(1,a); i<=Math.min(n,b); i++) out.add(i);
  });
  return out;
}
/* draw image centered at displayed (xr,yr) with width = frac * displayed page width; handles /Rotate */
function placeImageOnPage(page, img, xr, yr, frac){
  const {width:W, height:H} = page.getSize();
  const r = ((page.getRotation().angle % 360) + 360) % 360;
  const dispW = (r % 180) ? H : W;
  const w = dispW * frac, h = w * img.height / img.width;
  let cx, cy;
  if(r === 90){ cx = yr*W; cy = xr*H; }
  else if(r === 180){ cx = W - xr*W; cy = yr*H; }
  else if(r === 270){ cx = W - yr*W; cy = H - xr*H; }
  else { cx = xr*W; cy = H - yr*H; }
  const t = r * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
  const x = cx - (w/2*c - h/2*s), y = cy - (w/2*s + h/2*c);
  page.drawImage(img, {x, y, width:w, height:h, rotate: PDFLib.degrees(r)});
}
/* opts: {getImage: async () => dataUrl|null, suffix, defaultFrac, title} */
function buildBatchPlacer(container, opts){
  let files = [], placer = null, point = null, frac = opts.defaultFrac || 0.25, scope = 'this', custom = '';
  const card = el('div', {class:'card'});
  card.appendChild(el('div', {class:'note'}, [opts.title || 'เลือกไฟล์ PDF (เลือกได้หลายไฟล์ ตำแหน่งเดียวกันจะใช้กับทุกไฟล์)']));
  const dz = buildDropzone({accept:'application/pdf', multiple:true, label:'เลือกไฟล์ PDF ที่ต้องการวาง', sub:'เลือกไฟล์ PDF',
    onFiles: async (fs) => { for(const f of fs) files.push({file:f, buf: await readAsArrayBuffer(f)}); point = null; await drawUI(); }});
  card.appendChild(dz);
  container.appendChild(card);
  const uiWrap = el('div'), resultWrap = el('div');
  container.appendChild(uiWrap); container.appendChild(resultWrap);
  let markerImgUrl = null;
  async function showMarker(){
    if(!point || !placer) return;
    if(!markerImgUrl) markerImgUrl = await opts.getImage();
    if(!markerImgUrl) return;
    const w = (placer.el.querySelector('.placer img').clientWidth || 600) * frac;
    placer.setMarker({page:point.page, xr:point.xr, yr:point.yr, html:`<img src="${markerImgUrl}" style="width:${w}px;display:block;opacity:.9;transform:translateY(50%)">`});
  }
  async function drawUI(){
    uiWrap.innerHTML = ''; resultWrap.innerHTML = '';
    if(!files.length) return;
    const fc = el('div', {class:'card'});
    const list = el('div', {class:'filelist'});
    files.forEach((f, i) => {
      const rm = el('button', {class:'iconbtn', html:ICONS.close, title:'เอาออก'});
      rm.addEventListener('click', async () => { files.splice(i,1); point = null; await drawUI(); });
      list.appendChild(el('div', {class:'file-item'}, [el('span', {class:'fname'}, [f.file.name]), el('span', {class:'fsize'}, [fmtBytes(f.file.size)]), rm]));
    });
    fc.appendChild(list);
    fc.appendChild(el('div', {class:'note'}, ['แตะตำแหน่งบนหน้าเอกสารที่ต้องการวาง' + (files.length>1 ? ' (ตัวอย่างจากไฟล์แรก)' : '')]));
    placer = await buildPagePlacer(new Uint8Array(files[0].buf), {
      onPick: async (pt) => {
        markerImgUrl = await opts.getImage();
        if(!markerImgUrl){ toast(opts.emptyMsg || 'ยังไม่ได้เลือกภาพที่จะวาง', true); return; }
        point = pt; showMarker();
      }
    });
    fc.appendChild(placer.el);
    const sf = el('div', {class:'field', style:'margin-top:12px;'}, [el('label', {}, [`ขนาด: ${Math.round(frac*100)}% ของความกว้างหน้า`]), el('input', {type:'range', min:'5', max:'70', step:'1', value:String(Math.round(frac*100))})]);
    sf.querySelector('input').addEventListener('input', e => { frac = (+e.target.value)/100; sf.querySelector('label').textContent = `ขนาด: ${e.target.value}% ของความกว้างหน้า`; showMarker(); });
    fc.appendChild(sf);
    const sel = el('select', {}, [
      el('option', {value:'this'}, ['เฉพาะหน้าที่แตะ']), el('option', {value:'all'}, ['ทุกหน้า']),
      el('option', {value:'first'}, ['หน้าแรก']), el('option', {value:'last'}, ['หน้าสุดท้าย']), el('option', {value:'custom'}, ['ระบุหน้าเอง']),
    ]);
    sel.value = scope;
    const customIn = el('input', {type:'text', placeholder:'เช่น 1,3-5', value:custom, style:'margin-top:8px;' + (scope==='custom'?'':'display:none;')});
    sel.addEventListener('change', () => { scope = sel.value; customIn.style.display = scope==='custom' ? '' : 'none'; });
    customIn.addEventListener('input', () => custom = customIn.value);
    fc.appendChild(el('div', {class:'field'}, [el('label', {}, ['วางในหน้าไหน']), sel, customIn]));
    uiWrap.appendChild(fc);
    const go = el('button', {class:'btn block'}, [files.length>1 ? `บันทึกทั้ง ${files.length} ไฟล์` : 'บันทึกลงในไฟล์']);
    go.addEventListener('click', apply);
    uiWrap.appendChild(go);
  }
  async function apply(){
    const url = await opts.getImage();
    if(!url){ toast(opts.emptyMsg || 'ยังไม่ได้เลือกภาพที่จะวาง', true); return; }
    if(!point){ toast('กรุณาแตะตำแหน่งบนหน้าเอกสารก่อน', true); return; }
    resultWrap.innerHTML = '';
    const status = el('div', {class:'note'}, [el('span',{class:'spinner'}), 'กำลังบันทึก...']);
    resultWrap.appendChild(status);
    try{
      const pngBytes = await fetchPngBytesFromDataUrl(url);
      const outs = [];
      for(const f of files){
        const doc = await PDFLib.PDFDocument.load(f.buf, {ignoreEncryption:true});
        const img = await doc.embedPng(pngBytes);
        const pages = doc.getPages(), n = pages.length;
        let targets;
        if(scope === 'all') targets = pages.map((_,i)=>i+1);
        else if(scope === 'first') targets = [1];
        else if(scope === 'last') targets = [n];
        else if(scope === 'custom') targets = [...parsePageList(custom, n)];
        else targets = [Math.min(point.page, n)];
        if(!targets.length) throw new Error('ไม่พบหน้าที่ระบุ');
        targets.forEach(p => placeImageOnPage(pages[p-1], img, point.xr, point.yr, frac));
        outs.push({name: f.file.name.replace(/\.pdf$/i,'') + (opts.suffix || '-วาง') + '.pdf', bytes: await doc.save(), count: targets.length});
      }
      resultWrap.innerHTML = '';
      outs.forEach(o => {
        const box = el('div', {class:'result-box'}, [el('div', {class:'rtext'}, [el('div', {class:'rtitle'}, [o.name]), el('div', {class:'rsub'}, [`${fmtBytes(o.bytes.length)} • วาง ${o.count} หน้า`])])]);
        const dl = el('button', {class:'btn'}, ['ดาวน์โหลด']);
        dl.addEventListener('click', () => downloadBytes(o.bytes, o.name, 'application/pdf'));
        box.appendChild(dl); resultWrap.appendChild(box);
      });
      if(outs.length > 1){
        const all = el('button', {class:'btn block secondary', style:'margin-top:12px;'}, ['ดาวน์โหลดทั้งหมด (.zip)']);
        all.addEventListener('click', () => downloadBlob(DocxLib.zip(outs.map(o => ({name:o.name, data:o.bytes})), 'application/zip'), `เอกสาร-${niceDate()}.zip`));
        resultWrap.appendChild(all);
      }
    }catch(err){ console.error(err); resultWrap.innerHTML = ''; resultWrap.appendChild(el('div', {class:'note warn'}, ['บันทึกไม่สำเร็จ: ' + err.message])); }
  }
  return { refresh(){ markerImgUrl = null; showMarker(); } };
}

/* ===================== PDF encryption (Standard security handler, RC4 128-bit, R3) ===================== */
const PdfCrypt = (() => {
  function md5(bytes){
    const K = new Int32Array(64), S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
    for(let i=0;i<64;i++) K[i] = Math.floor(Math.abs(Math.sin(i+1)) * 4294967296) | 0;
    const n = bytes.length, total = ((n + 8) >> 6) + 1, buf = new Uint8Array(total*64);
    buf.set(bytes); buf[n] = 0x80;
    const bits = n * 8; const dv = new DataView(buf.buffer);
    dv.setUint32(total*64-8, bits >>> 0, true); dv.setUint32(total*64-4, Math.floor(bits / 4294967296), true);
    let a0=0x67452301|0, b0=0xefcdab89|0, c0=0x98badcfe|0, d0=0x10325476|0;
    const M = new Int32Array(16);
    for(let blk=0; blk<total; blk++){
      for(let j=0;j<16;j++) M[j] = dv.getInt32(blk*64 + j*4, true);
      let A=a0, B=b0, C=c0, D=d0;
      for(let i=0;i<64;i++){
        let F, g;
        if(i<16){ F=(B&C)|(~B&D); g=i; }
        else if(i<32){ F=(D&B)|(~D&C); g=(5*i+1)%16; }
        else if(i<48){ F=B^C^D; g=(3*i+5)%16; }
        else { F=C^(B|~D); g=(7*i)%16; }
        F = (F + A + K[i] + M[g]) | 0;
        A = D; D = C; C = B;
        B = (B + ((F << S[i]) | (F >>> (32 - S[i])))) | 0;
      }
      a0=(a0+A)|0; b0=(b0+B)|0; c0=(c0+C)|0; d0=(d0+D)|0;
    }
    const out = new Uint8Array(16), ov = new DataView(out.buffer);
    ov.setInt32(0,a0,true); ov.setInt32(4,b0,true); ov.setInt32(8,c0,true); ov.setInt32(12,d0,true);
    return out;
  }
  function rc4(key, data){
    const s = new Uint8Array(256); for(let i=0;i<256;i++) s[i]=i;
    for(let i=0,j=0;i<256;i++){ j=(j+s[i]+key[i%key.length])&255; const t=s[i]; s[i]=s[j]; s[j]=t; }
    const out = new Uint8Array(data.length);
    for(let k=0,i=0,j=0;k<data.length;k++){ i=(i+1)&255; j=(j+s[i])&255; const t=s[i]; s[i]=s[j]; s[j]=t; out[k]=data[k]^s[(s[i]+s[j])&255]; }
    return out;
  }
  const PAD = new Uint8Array([0x28,0xBF,0x4E,0x5E,0x4E,0x75,0x8A,0x41,0x64,0x00,0x4E,0x56,0xFF,0xFA,0x01,0x08,0x2E,0x2E,0x00,0xB6,0xD0,0x68,0x3E,0x80,0x2F,0x0C,0xA9,0xFE,0x64,0x53,0x69,0x7A]);
  function padPw(pw){ const b = new Uint8Array(32); const raw = Array.from(pw).slice(0,32).map(c => c.charCodeAt(0) & 255); b.set(raw); b.set(PAD.subarray(0, 32-raw.length), raw.length); return b; }
  const cat = (...arrs) => { const n = arrs.reduce((s,a)=>s+a.length,0), o = new Uint8Array(n); let p=0; arrs.forEach(a=>{o.set(a,p); p+=a.length;}); return o; };
  function computeO(ownerPw, userPw){
    let h = md5(padPw(ownerPw)); for(let i=0;i<50;i++) h = md5(h);
    let o = rc4(h, padPw(userPw));
    for(let i=1;i<=19;i++) o = rc4(h.map(x => x ^ i), o);
    return o;
  }
  function computeKey(userPw, O, P, id0){
    const p = new Uint8Array(4); new DataView(p.buffer).setInt32(0, P, true);
    let h = md5(cat(padPw(userPw), O, p, id0));
    for(let i=0;i<50;i++) h = md5(h);
    return h;
  }
  function computeU(key, id0){
    let u = rc4(key, md5(cat(PAD, id0)));
    for(let i=1;i<=19;i++) u = rc4(key.map(x => x ^ i), u);
    return cat(u, new Uint8Array(16));
  }
  function objKey(key, num, gen){
    return md5(cat(key, new Uint8Array([num&255,(num>>8)&255,(num>>16)&255, gen&255,(gen>>8)&255]))).subarray(0,16);
  }
  const hex = u8 => Array.from(u8, b => b.toString(16).padStart(2,'0')).join('');
  /* perms: {print, copy, modify} booleans */
  async function encrypt(pdfBytes, userPw, ownerPw, perms){
    const L = PDFLib;
    const doc = await L.PDFDocument.load(pdfBytes, {ignoreEncryption:true, updateMetadata:false});
    const ctx = doc.context;
    let P = 0xFFFFF0C0 | 0;
    if(perms.print) P |= (1<<2) | (1<<11);
    if(perms.modify) P |= (1<<3) | (1<<5) | (1<<8) | (1<<10);
    if(perms.copy) P |= (1<<4) | (1<<9);
    const id0 = md5(new TextEncoder().encode(Date.now() + ':' + Math.random() + ':' + pdfBytes.length));
    const O = computeO(ownerPw, userPw);
    const key = computeKey(userPw, O, P, id0);
    const U = computeU(key, id0);
    const encStr = (k, obj) => {
      if(obj instanceof L.PDFString || obj instanceof L.PDFHexString) return L.PDFHexString.of(hex(rc4(k, obj.asBytes())));
      if(obj instanceof L.PDFArray){ for(let i=0;i<obj.size();i++) obj.set(i, encStr(k, obj.get(i))); return obj; }
      if(obj instanceof L.PDFDict){ for(const [n,v] of obj.entries()) obj.set(n, encStr(k, v)); return obj; }
      return obj;
    };
    for(const [ref, obj] of ctx.enumerateIndirectObjects()){
      const k = objKey(key, ref.objectNumber, ref.generationNumber);
      if(obj instanceof L.PDFRawStream){
        const t = obj.dict.lookup(L.PDFName.of('Type'));
        if(t === L.PDFName.of('XRef')) continue;
        encStr(k, obj.dict);
        ctx.assign(ref, L.PDFRawStream.of(obj.dict, rc4(k, obj.contents)));
      } else if(obj instanceof L.PDFStream){
        const contents = obj.getContents();
        encStr(k, obj.dict);
        ctx.assign(ref, L.PDFRawStream.of(obj.dict, rc4(k, contents)));
      } else {
        const r = encStr(k, obj); if(r !== obj) ctx.assign(ref, r);
      }
    }
    const encDict = ctx.obj({Filter:'Standard', V:2, R:3, Length:128, P});
    encDict.set(L.PDFName.of('O'), L.PDFHexString.of(hex(O)));
    encDict.set(L.PDFName.of('U'), L.PDFHexString.of(hex(U)));
    ctx.trailerInfo.Encrypt = ctx.register(encDict);
    const idHex = L.PDFHexString.of(hex(id0));
    ctx.trailerInfo.ID = ctx.obj([idHex, idHex]);
    return doc.save({useObjectStreams:false, updateFieldAppearances:false, addDefaultPage:false});
  }
  return {encrypt, md5};
})();
